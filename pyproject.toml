[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd"
dynamic = ["version", "readme"]
description = "Give your small robot a brain. Any LLM, one .duck file. Microduck, Open Duck Mini, Reachy Mini, LeRobot arms and ROS bases."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
keywords = [
  "microduck", "open-duck-mini", "reachy-mini", "lerobot", "ros", "rosbridge",
  "robotics", "embodied-ai", "physical-ai", "llm-agents",
  "mcp", "model-context-protocol", "reinforcement-learning", "sim2real",
  "claude", "openai", "ollama", "vllm", "llama-cpp", "local-llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The default install must stay light so `uvx quackd` is fast.
# Provider SDKs, YOLO and the live window are extras.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.3",
  "opencv-python-headless>=4.9",
  "python-dotenv>=1.0",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
grok = ["openai>=1.50"]
all = ["anthropic>=1.0,<2", "openai>=1.50", "google-genai>=1.0"]
yolo = ["ultralytics>=8.2"]
live = ["pygame>=2.5"]
# Robot SDKs are extras too: the default install never imports one. reachy-mini pulls
# onnxruntime, FastAPI and a GStreamer bundle (read from the 1.10.0 wheel, 2026-09-02).
reachy = ["reachy-mini>=1.10,<2"]
# LAN: zeroconf discovery and the MQTT flock bus (docs/lan.md). Never imported by default.
lan = ["zeroconf>=0.132", "paho-mqtt>=2,<3"]
# LeRobot needs Python 3.12 and pulls torch; the marker keeps the lock solvable on 3.11.
lerobot = ["lerobot>=0.6; python_version >= '3.12'"]
rosbridge = ["roslibpy>=2,<3"]
# The Microduck's camera reaches clients only as an H.264 WebRTC track from mediad — there is
# no camera method in duck-ipc-proto and no snapshot endpoint — so a picture means being a
# WebRTC peer. Heavy (aiortc pulls av, which pulls FFmpeg), needed by nobody who is not
# pointing quackd at a real Microduck, and never imported unless --camera-url says webrtc://.
microduck-camera = ["aiortc>=1.9", "av>=12", "websockets>=13"]
dev = [
  # hatchling is already the build backend; dev gets it so tests/test_pypi_readme.py
  # can import the metadata hook that rewrites the README for PyPI.
  "hatchling>=1.25",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.scripts]
quackd = "quackd.cli:app"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Repository = "https://github.com/rokbenko/quackd"
Issues = "https://github.com/rokbenko/quackd/issues"
Changelog = "https://github.com/rokbenko/quackd/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "quackd/__init__.py"

# README.md is the PyPI long description, and its links are relative because that is
# what is correct on GitHub. `hatch_build.py` absolutises them at build time so they
# resolve on the project page too (tests/test_pypi_readme.py holds it to that).
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["quackd"]

# The starter .duck files live at the repo root (that is the community funnel)
# but ship inside the wheel so `uvx quackd run find-and-kick` works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"ducks" = "quackd/ducks"

# `bridge/` is the daemon that runs on an Open Duck Mini v2's Raspberry Pi. It ships in the
# sdist and the repository, never in the wheel: quackd must not import it, and a Pi copies
# the one file it needs rather than installing quackd's whole dependency tree.
[tool.hatch.build.targets.sdist]
include = [
  "quackd", "ducks", "bridge", "docs", "tests",
  "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "hatch_build.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"quackd/cli.py" = ["T20"]
"quackd/mcp_server.py" = ["T20"]
"tests/**" = ["T20"]
# Prose-heavy files: upstream citations and LLM-facing prompt text read better unwrapped.
"quackd/transport/upstream_api.py" = ["E501"]
"quackd/agent/prompts.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
# No python_version pin: each CI job checks with its own interpreter. Pinning 3.11 made
# mypy reject numpy's stubs (PEP 695 `type` statements) when running under 3.12.
# `bridge/` is the code that runs on the robot, and it was the only Python here that nothing
# type-checked. mypy takes packages OR files, not both, so both are listed as paths.
files = ["quackd", "bridge"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
