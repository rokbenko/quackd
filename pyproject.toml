[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd"
dynamic = ["version", "readme"]
description = "One CLI for all your robots. Connect them, command them, and let them work together, each with an LLM for a brain. Microduck, Open Duck Mini, LeRobot arms, XLeRobot carts, AlohaMini, ToddlerBot and ROS bases."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
keywords = [
  "microduck", "open-duck-mini", "lerobot", "so-101", "xlerobot", "alohamini", "toddlerbot", "humanoid", "ros", "ros2", "rosbridge",
  # "robot-fleet" is a PyPI search term people type, and the one place the retired word stays on purpose.
  "robotics", "embodied-ai", "physical-ai", "llm-agents", "multi-robot", "robot-fleet",
  "mcp", "model-context-protocol", "mujoco",
  "claude", "openai", "gemini", "grok", "mistral", "deepseek", "cohere", "qwen", "kimi", "glm", "meta",
  "jev", "kev", "von", "openjev", "opendecision", "laya",
  "ollama", "vllm", "llama-cpp", "local-llm", "jetson",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The default install must stay light so `uvx quackd` is fast.
# Provider SDKs, YOLO and the live window are extras.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.3",
  "opencv-python-headless>=4.9",
  "python-dotenv>=1.0",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
# The floor is 1.66 because that is the release the Responses API arrived in, and
# `providers/openai.py` opens there for the models the catalogue marks. On 1.65 the
# client carries no `responses` at all, so the old `>=1.50` allowed an install that
# could only fail at the first call on those models.
openai = ["openai>=1.66,<4"]
gemini = ["google-genai>=1.0,<3"]
# Eight vendors, one wheel. Each speaks OpenAI's API at its own address, so the extra exists
# to name the install a reader of `quackd doctor` or a ProviderNotInstalled actually wants,
# not because there is a second package to fetch (see EXTRA_FOR in agent/providers/factory.py).
grok = ["openai>=1.66,<4"]
mistral = ["openai>=1.66,<4"]
deepseek = ["openai>=1.66,<4"]
cohere = ["openai>=1.66,<4"]
qwen = ["openai>=1.66,<4"]
kimi = ["openai>=1.66,<4"]
glm = ["openai>=1.66,<4"]
meta = ["openai>=1.66,<4"]
# The System One protocol client: the optional discrete stepper in front of the model
# (`quackd run --decision-llm`, `quackd/agent/decision/`, docs/guides/decision-llms/README.md).
# Every decision LLM quackd knows that is a server speaks the same wire format and is reached by
# repointing its base URL, so this one wheel covers Jev, Kev, Von, OpenJev, OpenDecision and
# whatever else answers at `--decision-url`. That is why the extra is named for the protocol
# and not for a vendor.
# Not a provider, and deliberately not in `all`: it answers typed questions about a state and
# generates nothing, so it cannot pilot a robot and does not belong in `--llm`. Nothing here
# is imported unless a run names a decision LLM.
# Pinned under 1.0 the way every vendor SDK here is: the format is young, and
# `quackd/agent/decision/systemone.py` reads its answers tolerantly for that reason. A 0.x
# minor is allowed to break it.
decision = ["typesafe-sdk>=0.7,<1"]
# The one decision LLM that runs in this process rather than behind a server: no port, no key,
# and no request leaving the machine. It pulls torch and transformers, so it is out of `all`
# for the same reason the robot simulators are.
laya = ["laya>=0.3,<1"]
all = ["anthropic>=1.0,<2", "openai>=1.66,<4", "google-genai>=1.0,<3"]
yolo = ["ultralytics>=8.2"]
live = ["pygame>=2.5"]
# The physics simulator: MuJoCo on the CPU, no GPU, both imported only inside connect().
# onnxruntime is what runs the robot's own walking policy; the Microduck's meshes and that
# policy are fetched at run time and never shipped here (docs/reference/licenses.md).
mujoco = ["quackd-microduck[mujoco]>=0.16.1,<0.17"]
microduck = ["quackd-microduck>=0.16.1,<0.17"]
# Every robot quackd publishes, each with the SDK its real backend needs. The honest "all":
# it pulls torch on Python 3.12 because the arm does.
robots = [
  "quackd-microduck>=0.16.1,<0.17",
  "quackd-lerobot[sdk]>=0.16.1,<0.17",
  "quackd-rosbridge[sdk]>=0.16.1,<0.17",
  "quackd-open-duck>=0.16.1,<0.17",
  "quackd-xlerobot>=0.16.1,<0.17",
  "quackd-alohamini>=0.16.1,<0.17",
  "quackd-toddlerbot>=0.16.1,<0.17",
]
# LAN: zeroconf discovery and the MQTT flock bus (docs/guides/lan.md). Never imported by default.
lan = ["zeroconf>=0.132", "paho-mqtt>=2,<3"]
# LeRobot needs Python 3.12 and pulls torch; the marker keeps the lock solvable on 3.11.
# `[feetech]` is where the serial SDK lives (feetech-servo-sdk and pyserial, neither of them a
# base dependency of lerobot). Without it `import lerobot` succeeds and opening the arm's port
# fails, so it belongs in the extra rather than in a paragraph somebody has to read.
lerobot = ["quackd-lerobot[sdk]>=0.16.1,<0.17"]
# The arm's simulator (`--robot lerobot:mujoco`): the real backend's code over a physics model
# of the SO-101, with MuJoCo and no LeRobot, so no torch and no 3.12 floor. The model is
# fetched at run time and never shipped (docs/reference/licenses.md).
lerobot-sim = ["quackd-lerobot[sim]>=0.16.1,<0.17"]
# The arm's policy server (`quackd policy serve`), which loads LeRobot checkpoints in a process
# of its own: LeRobot, torch and transformers on Python 3.12, and nothing the arm's own process
# imports. Install it where the policy runs, on the laptop beside the arm or on a rented GPU.
lerobot-vla = ["quackd-lerobot[vla]>=0.16.1,<0.17"]
rosbridge = ["quackd-rosbridge[sdk]>=0.16.1,<0.17"]
# XLeRobot is not an installable package: its own install is copying files into a lerobot
# tree. So quackd speaks its ZeroMQ host protocol instead and needs only pyzmq, which keeps
# the 3.11 floor and works on Windows (ADR-0026, docs/adapters/xlerobot/README.md).
xlerobot = ["quackd-xlerobot>=0.16.1,<0.17"]
# AlohaMini is a fork of LeRobot that calls itself lerobot and is not published, so it
# cannot be a dependency at all. quackd speaks its ZeroMQ host protocol instead.
alohamini = ["quackd-alohamini>=0.16.1,<0.17"]
open_duck = ["quackd-open-duck>=0.16.1,<0.17"]
toddlerbot = ["quackd-toddlerbot>=0.16.1,<0.17"]
# The Microduck's camera reaches clients only as an H.264 WebRTC track from mediad — there is
# no camera method in duck-ipc-proto and no snapshot endpoint — so a picture means being a
# WebRTC peer. Heavy (aiortc pulls av, which pulls FFmpeg), needed by nobody who is not
# pointing quackd at a real Microduck, and never imported unless --camera-url says webrtc://.
microduck-camera = ["quackd-microduck[camera]>=0.16.1,<0.17"]
dev = [
  # hatchling is already the build backend; dev gets it so tests/test_pypi_readme.py
  # can import the metadata hook that rewrites the README for PyPI.
  "hatchling>=1.25",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
  # every adapter, without the SDKs: the suite drives each one against fakes and a mock
  "quackd-microduck",
  "quackd-lerobot",
  "quackd-rosbridge",
  "quackd-open-duck",
  "quackd-xlerobot",
  "quackd-alohamini",
  "quackd-toddlerbot",
  # The one robot SDK dev carries, because it is the only way the xlerobot wire protocol is
  # exercised for real: tests/test_xlerobot_host.py runs quackd's client against a fake host
  # over loopback sockets. It is a small pure wheel on every platform CI runs, unlike torch
  # or onnxruntime, and docs/adapters/status.md claims that test, so CI has to be able to
  # run it.
  "pyzmq>=26",
]

[project.scripts]
quackd = "quackd.cli:main"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Repository = "https://github.com/rokbenko/quackd"
Issues = "https://github.com/rokbenko/quackd/issues"
Changelog = "https://github.com/rokbenko/quackd/blob/main/CHANGELOG.md"

# One repository, several distributions. The adapters are their own packages so that
# `uv pip install quackd` brings no robot and you choose the one you own.
[tool.uv.workspace]
members = ["adapters/*"]

[tool.uv.sources]
quackd-microduck = { workspace = true }
quackd-lerobot = { workspace = true }
quackd-rosbridge = { workspace = true }
quackd-open-duck = { workspace = true }
quackd-xlerobot = { workspace = true }
quackd-alohamini = { workspace = true }
quackd-toddlerbot = { workspace = true }

[tool.hatch.version]
path = "quackd/__init__.py"

# README.md is the PyPI long description, and its links are relative because that is
# what is correct on GitHub. `hatch_build.py` absolutises them at build time so they
# resolve on the project page too (tests/test_pypi_readme.py holds it to that).
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["quackd"]

# The starter .duck files live at the repo root (that is the community funnel)
# but ship inside the core wheel so a task file needs no checkout. The body it runs on is a
# separate install: `uvx --from "quackd[microduck]" quackd run find-and-kick`.
[tool.hatch.build.targets.wheel.force-include]
"ducks" = "quackd/ducks"

# `bridge/` is the code quackd ships for another machine: the Open Duck Mini v2's daemons on
# its Raspberry Pi, the AlohaMini's host on that robot, the ToddlerBot's daemon on its Jetson,
# and the Jetson host daemon (`bridge/jetson/`), which serves a board's camera, detections and
# health to a quackd running elsewhere. All of it ships in the sdist and the repository, never
# in the wheel: quackd must not import it, and a robot or a board copies the file it needs
# rather than installing quackd's whole dependency tree.
[tool.hatch.build.targets.sdist]
include = [
  "quackd", "ducks", "bridge", "docs", "tests",
  "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "hatch_build.py",
]
# The README's images are served from raw.githubusercontent, so no published artefact ever
# needed them. Keeping them out matters for one of them: `quackd-on-off.gif` renders
# upstream's model
# and carries its CC BY-SA-NC terms, and a published package must stay wholly Apache-2.0.
exclude = ["docs/assets/*.gif", "docs/assets/*.png", "docs/assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `docs/assets` held two scripts that nothing linted, formatted or type-checked, one of which
# builds the README's simulator figure. Only the binaries are excluded now.
extend-exclude = ["runs"]

# The adapter packages are quackd's own code in their own distributions, so they sort with
# the core rather than with somebody else's library.
[tool.ruff.lint.isort]
known-first-party = [
  "quackd",
  "quackd_alohamini",
  "quackd_microduck",
  "quackd_lerobot",
  "quackd_open_duck",
  "quackd_rosbridge",
  "quackd_toddlerbot",
  "quackd_xlerobot",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"quackd/cli.py" = ["T20"]
"quackd/mcp_server.py" = ["T20"]
"tests/**" = ["T20"]
# The scripts that build the README's assets are run by hand and report as they go.
"docs/assets/*.py" = ["T20"]
# Run by hand at a release and reports which of the eight files it rewrote, which is the
# whole of its user interface.
"scripts/*.py" = ["T20"]
# The browser demo's dev server. It is a command a person runs, and printing the URL it
# mounted on is the whole of its user interface.
"web/serve.py" = ["T20"]
# The same, for the generator beside it: it is run by hand and reports what it wrote.
"web/build_catalogue.py" = ["T20"]
# And the third: it cuts the mark out of quackd-web's duck and says where it put it.
"web/make_mark.py" = ["T20"]
# Prose-heavy files: upstream citations and LLM-facing prompt text read better unwrapped.
"adapters/microduck/src/quackd_microduck/upstream_api.py" = ["E501"]
"quackd/agent/prompts.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
# No python_version pin: each CI job checks with its own interpreter. Pinning 3.11 made
# mypy reject numpy's stubs (PEP 695 `type` statements) when running under 3.12.
# `bridge/` is the code that runs on the robot, and it was the only Python here that nothing
# type-checked. mypy takes packages OR files, not both, so both are listed as paths.
files = ["quackd", "adapters", "bridge", "docs/assets"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    # The tests allowed to read the developer's own asset cache, with so101_model below: the
    # conftest does not redirect them to a throwaway one. They never fetch: an empty cache skips.
    "real_duck: needs upstream's Microduck model and policies already cached",
    # The arm simulator's counterpart: the SO-101's model from SO-ARM100, fetched at run time
    # and never shipped. The conftest leaves them the real cache too, and they never fetch
    # either: an empty cache, with no QUACKD_LEROBOT_SIM_ASSETS checkout, skips them.
    "so101_model: needs the SO-101's MuJoCo model from SO-ARM100 already fetched",
    # Cost money and reach the network. Opt-in twice: this marker and QUACKD_LIVE_LLM=1, so a
    # bare `pytest -m live_llm` on a machine with a key still skips until it is asked for.
    "live_llm: calls a real LLM over the network (needs OPENAI_API_KEY and QUACKD_LIVE_LLM=1)",
    # The same bargain for the stepper, and the only tests that can measure how long a real
    # decision LLM takes: four of the seven publish a figure for their own hardware and their
    # own task, and none of those is a measurement of answering a robot through quackd.
    """live_decision: calls a real decision LLM over the network (needs that preset's key, \
TYPESAFE_API_KEY for jev, and QUACKD_LIVE_DECISION=1)""",
]
# A single test that runs five minutes has hung: the slowest here, a ten-seed sweep, takes
# well under one. pytest then dumps every thread's stack to stderr and carries on, so the
# job timeout in ci.yml ends a hang with the blocked frame in the log rather than nothing.
faulthandler_timeout = 300
