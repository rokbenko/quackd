[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboglot"
dynamic = ["version", "readme"]
description = "The communication layer between people and robots, and between robots. Talk to any robot in your own words, with an LLM for its brain. Robots that have never met check each other's passports and share the work. Microduck, Huebot, Open Duck Mini, LeRobot arms, XLeRobot carts, AlohaMini, ToddlerBot, MOSS, ROS bases and industrial arms on ROS 2."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
keywords = [
  "microduck", "huebot", "open-duck-mini", "lerobot", "so-101", "xlerobot", "alohamini", "toddlerbot", "moss", "humanoid", "ros", "ros2", "rosbridge",
  "rosarm", "industrial-arm", "ur5e", "kuka", "motoman",
  # "robot-fleet" is a PyPI search term people type, and the one place the retired word stays on purpose.
  "robotics", "embodied-ai", "physical-ai", "llm-agents", "multi-robot", "robot-fleet",
  "robot-communication", "human-robot-interaction", "robot-to-robot", "robot-passport",
  "mcp", "model-context-protocol",
  "claude", "openai", "gemini", "grok", "mistral", "deepseek", "cohere", "qwen", "kimi", "glm", "meta",
  "openrouter",
  "jev", "kev", "openjev", "opendecision", "laya",
  "vla", "vision-language-action", "huggingface", "gr00t", "smolvla", "pi0",
  "ollama", "vllm", "llama-cpp", "local-llm", "jetson",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The default install must stay light so `uvx roboglot` is fast.
# Provider SDKs and YOLO are extras.
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  # 13.0.0 is the first release with the fixes for the advisories CHANGELOG.md's 0.31.3 names,
  # in the decoders a camera's picture reaches, and LeRobot 0.7.0 allows it, so no install of
  # Roboglot takes an older one any more.
  "pillow>=13",
  # `roboglot ui`'s QR code for a phone (roboglot/webui/launch.py), and imported nowhere else: pure
  # Python, a 77 KB wheel and about 300 KB on disk, with nothing under it. Here rather than in the
  # `ui` extra so that the code survives an upgrade that keeps Streamlit and forgets the extra.
  "segno>=1.6",
  "python-dotenv>=1.0",
  "mcp>=2.0,<3",
  # Robot Passport signs and verifies with Ed25519 (roboglot/passport/). mcp already brings it
  # in through pyjwt[crypto], and a module that imports it says so here rather than leaning
  # on somebody else's dependency staying put.
  "cryptography>=42",
  # `roboglot drive`'s keyboard (roboglot/drive/terminal.py), and imported nowhere else. 3.0.42 is
  # the release that fixed `patch_stdout`'s line wrapping on Windows, which drive keeps Rich's
  # lines above the prompt with; its pipe input became a context manager earlier, in 3.0.29.
  "prompt-toolkit>=3.0.42",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0,<2"]
# The floor is 1.66 because that is the release the Responses API arrived in, and
# `providers/openai.py` opens there for the LLMs the catalogue marks. On 1.65 the
# client carries no `responses` at all, so the old `>=1.50` allowed an install that
# could only fail at the first call on those LLMs.
openai = ["openai>=1.66,<4"]
gemini = ["google-genai>=1.0,<3"]
# Nine vendors, one wheel. Each speaks OpenAI's API at its own address, so the extra exists
# to name the install a reader of `roboglot doctor` or a ProviderNotInstalled actually wants,
# not because there is a second package to fetch (see EXTRA_FOR in agent/providers/factory.py).
grok = ["openai>=1.66,<4"]
mistral = ["openai>=1.66,<4"]
deepseek = ["openai>=1.66,<4"]
cohere = ["openai>=1.66,<4"]
qwen = ["openai>=1.66,<4"]
kimi = ["openai>=1.66,<4"]
glm = ["openai>=1.66,<4"]
meta = ["openai>=1.66,<4"]
openrouter = ["openai>=1.66,<4"]
# The System One protocol client: the optional discrete stepper in front of the pilot LLM
# (`roboglot run --decision-llm`, `roboglot/agent/decision/`, docs/guides/decision-llms/README.md).
# Every decision LLM Roboglot knows that is a System One server is reached by repointing its base
# URL, so this one wheel covers Jev, Kev, OpenJev, OpenDecision and whatever else answers
# at `--decision-url`. That is why the extra is named for the protocol and not for a vendor.
# `--decision-llm openai` speaks OpenAI's own format instead, through the `openai` extra above.
# Not a provider, and deliberately not in `all`: it answers typed questions about a state and
# generates nothing, so it cannot pilot a robot and does not belong in `--llm`. Nothing here
# is imported unless a run names a decision LLM.
# Pinned under 1.0 the way every vendor SDK here is: the format is young, and
# `roboglot/agent/decision/systemone.py` reads its answers tolerantly for that reason. A 0.x
# minor is allowed to break it.
decision = ["typesafe-sdk>=0.7,<1"]
# The one decision LLM that runs in this process rather than behind a server: no port, no key,
# and no request leaving the machine. It pulls torch and transformers, so it is out of `all`.
laya = ["laya>=0.3,<1"]
all = ["anthropic>=1.0,<2", "openai>=1.66,<4", "google-genai>=1.0,<3"]
# ultralytics brings `opencv-python`, the build that wants a display's libraries, and a headless
# Linux box has none. The core's own headless wheel used to answer `import cv2` there, so the wheel
# comes with this extra now that the core has no use for it.
yolo = ["ultralytics>=8.2", "opencv-python-headless>=4.9"]
microduck = ["roboglot-microduck>=0.34.0,<0.35"]
# Every robot Roboglot publishes, each with the SDK its real backend needs. The honest "all":
# it pulls torch on Python 3.12 because the arm does.
robots = [
  "roboglot-microduck>=0.34.0,<0.35",
  "roboglot-lerobot[sdk]>=0.34.0,<0.35",
  "roboglot-rosbridge[sdk]>=0.34.0,<0.35",
  "roboglot-open-duck>=0.34.0,<0.35",
  "roboglot-xlerobot>=0.34.0,<0.35",
  "roboglot-alohamini>=0.34.0,<0.35",
  "roboglot-toddlerbot>=0.34.0,<0.35",
  "roboglot-huebot>=0.34.0,<0.35",
  "roboglot-moss>=0.34.0,<0.35",
  "roboglot-rosarm[sdk]>=0.34.0,<0.35",
]
# LAN: zeroconf discovery and the MQTT team bus (docs/guides/lan.md). Never imported by default.
lan = ["zeroconf>=0.132", "paho-mqtt>=2,<3"]
# The page `roboglot ui` serves, in a browser or on a phone (docs/guides/web-ui.md). Streamlit
# brings pyarrow and pandas, so it is never core. 1.61 is the floor because the page polls its
# runs through `st.fragment(run_every=...)`: 1.59 and 1.61 each fixed a TypeError it raised, and
# 1.60 stopped it rerunning twice a tick. CI tests the version uv.lock pins.
ui = ["streamlit>=1.61,<2"]
# Robot Passport on the robot's own computer (`roboglot onboard`): zeroconf for the LAN half on
# every platform, an OpenAI-compatible client for the robot's brain, and bleak and dbus-fast for
# the Bluetooth half, which is BlueZ and so Linux only. On Windows and macOS the last two are
# left out by their markers, and `roboglot onboard serve --board sim` needs neither. Kept out of
# `dev` and `all`: a laptop that only drives robots never imports any of it (roboglot/radio/).
onboard = [
  "zeroconf>=0.132",
  "openai>=1.66,<4",
  "bleak>=3.0.2,<4; platform_system == 'Linux'",
  "dbus-fast>=5.2,<6; platform_system == 'Linux'",
]
# LeRobot needs Python 3.12 and pulls torch; the marker keeps the lock solvable on 3.11.
# `[feetech]` is where the serial library lives (rustypot, which drives the arm's motors, and
# pyserial, which `lerobot-find-port` lists the ports with, neither of them a base dependency of
# lerobot). Without it `import lerobot` succeeds and opening the arm's port fails, so it belongs
# in the extra rather than in a paragraph somebody has to read.
lerobot = ["roboglot-lerobot[sdk]>=0.34.0,<0.35"]
# The arm's policy server (`roboglot policy serve`), which loads LeRobot checkpoints in a process
# of its own: LeRobot, torch and transformers on Python 3.12, and nothing the arm's own process
# imports. Install it where the policy runs, on the laptop beside the arm or on a rented GPU.
lerobot-vla = ["roboglot-lerobot[vla]>=0.34.0,<0.35"]
rosbridge = ["roboglot-rosbridge[sdk]>=0.34.0,<0.35"]
# An industrial arm on ROS 2 through rosbridge: a family over the rosbridge package's binding, so
# it brings that package and, through its extra, the same roslibpy. Rehearsed only: its ws backend
# refuses every arm until an owner names a date for its first hardware run (ADR-0076).
rosarm = ["roboglot-rosarm[sdk]>=0.34.0,<0.35"]
# XLeRobot is not an installable package: its own install is copying files into a lerobot
# tree. So Roboglot speaks its ZeroMQ host protocol instead and needs only pyzmq, which keeps
# the 3.11 floor and works on Windows (ADR-0026, docs/adapters/xlerobot/README.md).
xlerobot = ["roboglot-xlerobot>=0.34.0,<0.35"]
# AlohaMini is a fork of LeRobot that calls itself lerobot and is not published, so it
# cannot be a dependency at all. Roboglot speaks its ZeroMQ host protocol instead.
alohamini = ["roboglot-alohamini>=0.34.0,<0.35"]
open_duck = ["roboglot-open-duck>=0.34.0,<0.35"]
toddlerbot = ["roboglot-toddlerbot>=0.34.0,<0.35"]
# Huebot's own API is closed. Its maker is writing a shim for the robot that is to answer the
# Microduck's JSON-RPC, which Roboglot speaks with the standard library, so there is no robot
# library to pull.
huebot = ["roboglot-huebot>=0.34.0,<0.35"]
# MOSS runs dimOS on the rover, which Roboglot does not import. It speaks MOSS's own cockpit, and
# a bridge Roboglot ships for the rover, over HTTP with the standard library, so there is no robot
# library to pull.
moss = ["roboglot-moss>=0.34.0,<0.35"]
# The Microduck's WebRTC camera: mediad's H.264 video track, which takes being a WebRTC peer.
# mediad also serves one PNG per GET /frame, which needs nothing installed, so this is for the
# stream. Heavy (aiortc pulls av, which pulls FFmpeg), needed by nobody who is not pulling the
# track off a real Microduck, and never imported unless --camera-url says webrtc://.
microduck-camera = ["roboglot-microduck[camera]>=0.34.0,<0.35"]

[project.scripts]
roboglot = "roboglot.cli:main"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Repository = "https://github.com/rokbenko/quackd"
Issues = "https://github.com/rokbenko/quackd/issues"
Changelog = "https://github.com/rokbenko/quackd/blob/main/CHANGELOG.md"

# A contributor's environment, and what CI's jobs sync: a dependency group (PEP 735) and not an
# extra, so it is never published with the wheel and nobody is offered `roboglot[dev]`. uv
# installs the `dev` group by default, so a bare `uv sync` is the whole setup.
[dependency-groups]
dev = [
  # hatchling is already the build backend; dev gets it so tests/test_pypi_readme.py
  # can import the metadata hook that rewrites the README for PyPI.
  "hatchling>=1.25",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.4",
  # CI's six test jobs run on every core a runner has (`-n auto`, ci.yml). Not in addopts: a test
  # that runs pytest itself reads that, and one test on a laptop has no need of workers.
  "pytest-xdist>=3.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  # every adapter, without the SDKs: the suite drives each one against fakes and a mock
  "roboglot-microduck",
  "roboglot-lerobot",
  "roboglot-rosbridge",
  "roboglot-open-duck",
  "roboglot-xlerobot",
  "roboglot-alohamini",
  "roboglot-toddlerbot",
  "roboglot-huebot",
  "roboglot-moss",
  "roboglot-rosarm",
  # The one robot SDK dev carries, because it is the only way the xlerobot wire protocol is
  # exercised for real: tests/test_xlerobot_host.py runs Roboglot's client against a fake host
  # over loopback sockets. It is a small pure wheel on every platform CI runs, unlike torch
  # or onnxruntime, and docs/adapters/status.md claims that test, so CI has to be able to
  # run it.
  "pyzmq>=26",
  # The oracle roboglot/perception/blobs.py is held to (tests/test_color_blob_parity.py), and what
  # reads the QR codes back (tests/test_webui_launch.py). Nothing in a Roboglot wheel imports it.
  "opencv-python-headless>=4.9",
]

# One repository, several distributions. The adapters are their own packages so that
# `uv pip install roboglot` brings no robot and you choose the one you own.
[tool.uv.workspace]
members = ["adapters/*"]

[tool.uv.sources]
roboglot-microduck = { workspace = true }
roboglot-lerobot = { workspace = true }
roboglot-rosbridge = { workspace = true }
roboglot-open-duck = { workspace = true }
roboglot-xlerobot = { workspace = true }
roboglot-alohamini = { workspace = true }
roboglot-toddlerbot = { workspace = true }
roboglot-huebot = { workspace = true }
roboglot-moss = { workspace = true }
roboglot-rosarm = { workspace = true }

[tool.hatch.version]
path = "roboglot/__init__.py"

# README.md is the PyPI long description, and its links are relative because that is
# what is correct on GitHub. `hatch_build.py` absolutises them at build time so they
# resolve on the project page too (tests/test_pypi_readme.py holds it to that).
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["roboglot"]

# The starter .glot files live at the repo root (that is the community funnel)
# but ship inside the core wheel so a task file needs no checkout. The body it runs on is a
# separate install: `uvx --from "roboglot[microduck]" roboglot run find-and-kick`.
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "roboglot/tasks"

# `bridge/` is the code Roboglot ships for another machine: the Open Duck Mini v2's daemons on its
# Raspberry Pi, the AlohaMini's host on that robot, the ToddlerBot's daemon on its Jetson, MOSS's
# bridge beside its cockpit on the rover, and the Jetson host daemon (`bridge/jetson/`), which
# serves a board's camera, detections and health to a Roboglot running elsewhere. All of it ships
# in the sdist and the repository, never in the wheel: Roboglot must not import it, and a robot or
# a board copies the file it needs rather than installing Roboglot's whole dependency tree.
[tool.hatch.build.targets.sdist]
include = [
  "roboglot", "tasks", "bridge", "docs", "tests",
  "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "hatch_build.py",
]
# The README's images are served from raw.githubusercontent, so no published artefact needs
# them. An example's log is read on GitHub, so no published artefact needs its GIF or its
# frames either.
exclude = [
  "docs/assets/*.gif", "docs/assets/*.png", "docs/assets/*.svg",
  "docs/examples/**/*.gif", "docs/examples/**/*.jpg",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `docs/assets` holds scripts that ruff lints, formats and mypy type-checks like the rest; only
# its binaries are excluded.
extend-exclude = ["runs"]

# The adapter packages are Roboglot's own code in their own distributions, so they sort with
# the core rather than with somebody else's library.
[tool.ruff.lint.isort]
known-first-party = [
  "roboglot",
  "roboglot_alohamini",
  "roboglot_huebot",
  "roboglot_microduck",
  "roboglot_moss",
  "roboglot_lerobot",
  "roboglot_open_duck",
  "roboglot_rosarm",
  "roboglot_rosbridge",
  "roboglot_toddlerbot",
  "roboglot_xlerobot",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"roboglot/cli.py" = ["T20"]
"roboglot/mcp_server.py" = ["T20"]
"tests/**" = ["T20"]
# The scripts that build the README's assets are run by hand and report as they go.
"docs/assets/*.py" = ["T20"]
# Run by hand at a release and reports which of the eleven files it rewrote, which is the
# whole of its user interface.
"scripts/*.py" = ["T20"]
# The run sheet's two helpers are run by hand too, and what they print is what they are for.
"docs/examples/**/*.py" = ["T20"]
# Prose-heavy files: upstream citations and LLM-facing prompt text read better unwrapped.
"adapters/microduck/src/roboglot_microduck/upstream_api.py" = ["E501"]
"roboglot/agent/prompts.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
# No python_version pin: each CI job checks with its own interpreter. Pinning 3.11 made
# mypy reject numpy's stubs (PEP 695 `type` statements) when running under 3.12.
# `bridge/` is the code that runs on the robot, and it was the only Python here that nothing
# type-checked. mypy takes packages OR files, not both, so both are listed as paths.
files = [
    "roboglot",
    "adapters",
    "bridge",
    "docs/assets",
    "scripts/models_docs.py",
    "scripts/connect_docs.py",
    "scripts/bodies_docs.py",
    "scripts/example_log.py",
    "scripts/upstream_drift.py",
    "scripts/changelog_lock.py",
]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# An unknown marker or key is an error, so a typo cannot pass for a mark that does nothing.
# `timeout` below is read by pytest-timeout, so every environment that runs pytest needs it: the
# `dev` group has it, and ci.yml's jobs sync that; fresh-install.yml names its packages.
addopts = "-q --strict-markers --strict-config"
# Another package's deprecation, raised inside its own code, is its maintainers' to mend and stays
# quiet. One raised at a line of this project's, in the core, an adapter or a bridge (each loaded
# as `roboglot*`) or in a test, is an error: a library or the standard library attributes its
# deprecation to the caller, so the line that has to change is ours. The module is a regex matched
# at the start of the module's name, and the last entry that matches wins. Scripts loaded under a
# bare name (`upstream_drift`, `example_log`) are not covered.
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::DeprecationWarning:roboglot.*",
    "error::DeprecationWarning:tests.*",
]
markers = [
    # Each holds a margin on a wall clock, so on a machine that workers have filled it fails for
    # the machine's reasons. CI runs these after the rest, on their own (ci.yml).
    "serial: holds a margin on a wall clock, and runs alone on CI, after the parallel stage",
    # Cost money and reach the network. Opt-in twice: this marker and ROBOGLOT_LIVE_LLM=1, so a
    # bare `pytest -m live_llm` on a machine with a key still skips until it is asked for.
    "live_llm: calls a real LLM over the network (needs OPENAI_API_KEY and ROBOGLOT_LIVE_LLM=1)",
    # The same bargain for the stepper, and the only tests that can measure how long a real
    # decision LLM takes: four of the eight publish a figure for their own hardware and their
    # own task, OpenAI only a ratio to its own Responses API, and none of those is a measurement
    # of answering a robot through Roboglot. This marker and live_llm are what tests/conftest.py
    # reads before it lets a request through the real openai SDK reach a host under openai.com, or
    # leaves a test its OPENAI_API_KEY: any other test that tries fails.
    """live_decision: calls a real decision LLM over the network (needs that preset's key, \
TYPESAFE_API_KEY for jev or OPENAI_API_KEY for openai, and ROBOGLOT_LIVE_DECISION=1)""",
]
# A single test that runs five minutes has hung. pytest then dumps every thread's stack to
# stderr and carries on, so the job timeout in ci.yml ends a hang with the blocked frame in
# the log rather than nothing.
faulthandler_timeout = 300
# The same five minutes, as a failure: pytest-timeout ends the test that ran longer (on Linux and
# macOS by a signal, so the run goes on; on Windows by a thread that dumps the stacks and ends the
# process). A test that waits longer on purpose says so with `@pytest.mark.timeout(N)` (0 turns it
# off), a module with `pytestmark = pytest.mark.timeout(N)`, a run by hand with `--timeout=0`.
timeout = 300
