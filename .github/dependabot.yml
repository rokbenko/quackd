version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    # uv.lock is what CI actually tests; the floors in pyproject.toml are hand-written and say
    # what a consumer may install against. Without this, a weekly bump raises those floors to
    # whatever it just locked -- #15 turned openai>=1.50 into >=3.11.0 across ten lines, and
    # narrowed all eight vendor extras for a reason no test ever asked for. Lock-only keeps the
    # two apart: dependabot moves the lock, a person moves a floor and says why.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    # Dependabot asks uv for one version of a package in every split of the lock at once, the
    # newest PyPI has, and for every entry below but hatchling uv finds none, because something
    # holds it back in one split: another package in the lock, or for av, Python 3.11. Five
    # failed the whole job every week from 2026-09-11 until they were ignored, and dm-tree on
    # every run from 2026-10-30. lerobot and rustypot are ignored before they can fail it, and so
    # is websockets 18, which PyPI does not have yet.
    # Only the versions the hold rules out are ignored, so a release inside it still comes in the
    # group. Drop an entry once what holds it back moves. hatchling, the last, is the build
    # backend, which the updater cannot move.
    ignore:
      # roboglot-lerobot's extras stop below lerobot 0.7.1 and rustypot 1.14, which nobody here has
      # read (adapters/lerobot/pyproject.toml). A person moves them together, with upstream_api.py.
      - dependency-name: "lerobot"
        versions: [">=0.7.1"]
      - dependency-name: "rustypot"
        versions: [">=1.14"]
      # lerobot 0.7, the arm's SDK on Python 3.12 and later, pins numpy>=2.0.0,<2.3.0.
      - dependency-name: "numpy"
        versions: [">=2.3.0"]
      # lerobot 0.7 pins opencv-python-headless>=4.9.0,<4.14.0 the same way.
      - dependency-name: "opencv-python-headless"
        versions: [">=4.14.0"]
      # From 8.4.124 on, ultralytics wants numpy under 2.0 or past 2.3.4 on macOS, and lerobot's
      # numpy>=2.0.0,<2.3.0 leaves it nothing there. The other platforms' split can still move:
      # a person runs uv lock --upgrade-package ultralytics.
      - dependency-name: "ultralytics"
        versions: [">=8.4.124"]
      # google-genai 2.34, behind roboglot[gemini] and roboglot[all], pins websockets>=13.0.0,<18.0,
      # and streamlit 1.67, behind roboglot[ui], pins websockets>=12.0.0,<18, so 17.x can still
      # come in the group.
      - dependency-name: "websockets"
        versions: [">=18.0"]
      # aiortc 1.16, behind roboglot-microduck[camera], takes av>=14.0.0,<20.0.0, and av 19 needs
      # Python 3.12, so the lock holds av 18 on Python 3.11 and av 19 on the rest. The 3.12 split
      # can still move: a person runs uv lock --upgrade-package av.
      - dependency-name: "av"
        versions: [">=19.0.0"]
      # dm-tree 0.1.10, behind roboglot-lerobot[vla], wants numpy>=2.3.2 on Python 3.14 and later,
      # and lerobot's numpy>=2.0.0,<2.3.0 leaves it nothing there.
      - dependency-name: "dm-tree"
        versions: [">=0.1.10"]
      # hatchling is the build backend, pinned under [build-system] and in the dev extra, and
      # Dependabot's uv updater cannot move it: it stops on every hatchling update with No
      # files have changed! before it runs uv. It did on 1.32.4 from 2026-09-25 and on 1.32.3
      # once that one was ignored on 2026-09-29, so every version is ignored and a person moves
      # hatchling with uv lock --upgrade-package hatchling.
      - dependency-name: "hatchling"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
