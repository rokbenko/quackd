name: LeRobot SO-101 hardware report
description: You ran quackd against a real SO-101 arm. Tell us what happened.
labels: ["lerobot", "hardware", "adapter-status"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. One SO-101 has run `lerobot:real`, on one Windows laptop, for an afternoon
        on 2026-09-15 and another on 2026-09-23, so yours is the second arm and the first on a
        machine this project has not seen, and a report that says "it did not work" is worth as
        much as one that says it did. Neither afternoon loaded a policy. The second reached the
        arm by a registered name, with a rest pose recorded that the arm could not reach, and
        most of its runs never moved the arm. What quackd changed after it has not met an arm
        yet, so on a policy, a rest pose that parks and a release, yours is still the first.

        Please follow [docs/adapters/lerobot/hardware-checklist.md](https://github.com/rokbenko/quackd/blob/main/docs/adapters/lerobot/hardware-checklist.md)
        first. It is ordered so that nothing moves until step 10, because this arm has no
        e-stop and LeRobot caps the torque of the gripper and of no other joint.
  - type: input
    id: quackd_version
    attributes:
      label: quackd version
      description: Output of `quackd --version`
    validations:
      required: true
  - type: input
    id: lerobot_version
    attributes:
      label: lerobot version
      description: "`pip show lerobot`, or the commit if you installed from source"
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Which checklist step did you reach?
      options:
        - "4: the extra installs, both doctor rows green"
        - "5: the port found and the arm calibrated"
        - "6: doctor connects and reads the arm back"
        - "7: lerobot-lookout, moving nothing"
        - "8: a camera opened and doctor showed a frame"
        - "9: the --dry-run rehearsal"
        - "10: gripper open and closed"
        - "11: one joint moved"
        - "12: an out-of-range goal refused"
        - "13: USB pulled mid-move"
        - "14: Ctrl-C mid-move"
        - "15: --by-hand, the starting pose set by hand"
        - "16: Ctrl-C with the arm in your hands"
        - "17: gripper closed on something soft"
        - "18: a policy, wired up in your own code"
    validations:
      required: true
  - type: dropdown
    id: gripper_open
    attributes:
      label: Which end of the gripper's 0..100 range is open?
      description: quackd assumes 100 is open. Everything it believes about holding rests on this.
      options:
        - "100 is open, as assumed"
        - "0 is open, the other way round"
        - "not tested"
    validations:
      required: true
  - type: input
    id: holding_reading
    attributes:
      label: What the gripper reads while actually holding something
      description: quackd calls it holding between 8 and 90 of 100, and nobody has seen a real grasp.
  - type: input
    id: temperature
    attributes:
      label: Servo temperature, cold and after ten minutes of work
      description: "quackd refuses to move at 60 °C; Feetech documents a 70 °C cut-off. Neither was measured here."
  - type: dropdown
    id: step_deg
    attributes:
      label: Did 5 degrees per action feel right in the room?
      options:
        - "about right"
        - "too fast, I lowered QUACKD_LEROBOT_MAX_STEP_DEG"
        - "too slow"
        - "not tested"
  - type: dropdown
    id: slow_move
    attributes:
      label: A move_joints given several seconds. Did it look like one motion, and arrive when the time was up?
      options:
        - "one motion, and it arrived on time"
        - "a staircase of small steps"
        - "it moved at the step cap whatever the time"
        - "not tested"
  - type: dropdown
    id: settle
    attributes:
      label: A joint let go at the edge of its travel. Did it settle onto its fold, and gently?
      description: >-
        Only if a run or doctor said a joint of the rest pose lies past its travel and parks at
        the edge. Name the joint, and how far the note said it had to go, under what the arm
        actually did.
      options:
        - "it eased down onto the fold"
        - "it dropped onto the fold"
        - "it stayed at the edge"
        - "no joint was said to lie past its travel"
        - "not tested"
  - type: dropdown
    id: stall
    attributes:
      label: Held a joint against its goal. Was the stall caught?
      options:
        - "yes, the verb failed with where it stopped"
        - "no, it kept trying"
        - "not tested"
  - type: dropdown
    id: by_hand_hold
    attributes:
      label: With --by-hand, did the arm stay where you put it when torque came back on?
      description: >-
        Name the joint that moved and how far under what the arm actually did, and whether a
        loaded arm behaved differently from an empty one.
      options:
        - "stayed where I put it"
        - "twitched or sagged: name the joint and how far"
        - "refused: a joint moved more than five degrees"
        - "not tested"
  - type: dropdown
    id: pencil_kept
    attributes:
      label: A pencil closed in the gripper by hand, through a drawing move. Was it still there at the end?
      options:
        - "still there at the end"
        - "slipped out"
        - "not tested"
  - type: input
    id: decision_llm
    attributes:
      label: A decision LLM, if you ran one with --decision-mode shadow
      description: Which one, how long it took to answer, and how often it agreed with the model.
  - type: input
    id: camera
    attributes:
      label: The camera, if you brought one
      description: Which OpenCV index it turned out to be, and whether it needed ?backend=msmf or a dropped mode.
  - type: textarea
    id: doctor
    attributes:
      label: quackd doctor --robot <the name you registered the arm under>
      description: >-
        The whole thing. It carries the calibration file, the joint ranges, the temperatures
        and the rest pose row. Hold the arm while it runs, because connecting takes torque off
        every motor for a moment.
      render: shell
    validations:
      required: true
  - type: textarea
    id: terminal
    attributes:
      label: "`terminal.txt` from the run directory"
      description: >-
        The whole session as you saw it, opening with
        the command that started the run and the version that ran it. Check it before you
        paste: quackd replaces the values of `--api-key` and `--token` and the credentials
        in a `--base-url`, an `--address` or a `--camera-url`, and nothing else on that
        screen (see SECURITY.md).
        A run driven from an MCP client writes no run directory, so there is none for those
        steps.
      render: text
  - type: textarea
    id: transcript
    attributes:
      label: The first 40 lines of transcript.jsonl
      render: json
  - type: textarea
    id: what_happened
    attributes:
      label: What the arm actually did
      description: What moved, what did not, and anything that surprised you. A video is welcome.
    validations:
      required: true
