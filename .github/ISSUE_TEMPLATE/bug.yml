name: Bug report
description: Something quacked when it should not have.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: quackd version
      description: Output of `quackd --version`
    validations:
      required: true
  - type: input
    id: robot
    attributes:
      label: Robot
      description: >-
        The `--robot <adapter>:<backend>` you ran. `quackd list-adapters` lists every one.
        Put `browser demo` if you hit it in the web page, or `not robot specific` for the
        CLI, docs, validation or MCP.
      placeholder: "microduck:mujoco"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - "fake"
        - "anthropic"
        - "openai"
        - "gemini"
        - "grok"
        - "mistral"
        - "deepseek"
        - "cohere"
        - "qwen"
        - "kimi"
        - "glm"
        - "meta"
        - "openrouter"
        - "ollama (local)"
        - "vllm (local)"
        - "llamacpp (local)"
        - "lmstudio (local)"
        - "local (any OpenAI compatible server)"
        - "MCP client (Claude Code / Desktop)"
  - type: textarea
    id: command
    attributes:
      label: Exact command and `.duck` file
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `quackd doctor`
      render: shell
  - type: textarea
    id: terminal
    attributes:
      label: "`terminal.txt` from the run directory"
      description: >-
        The whole session as you saw it, which is usually the one file that answers the
        question, because it opens with
        the command that started the run and the version that ran it. Check it before you
        paste: quackd replaces the values of `--api-key` and `--token` and the credentials
        in a `--base-url`, an `--address` or a `--camera-url`, and nothing else on that
        screen (see SECURITY.md).
      render: text
  - type: textarea
    id: transcript
    attributes:
      label: Relevant lines from `runs/<timestamp>/transcript.jsonl`
      render: json
