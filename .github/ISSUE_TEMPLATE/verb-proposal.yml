name: Verb proposal
description: Propose a new verb (core, extension, or learned).
labels: ["verb", "enhancement"]
body:
  - type: input
    id: name
    attributes:
      label: Verb name
      placeholder: e.g. circle_around
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: See CONTRIBUTING.md "Add a verb". A verb not in a manifest does not exist.
      options:
        - "core (any robot whose manifest meets its requirements, in quackd/verbs/core.py)"
        - "extension (one body's own behaviour, in that adapter's verbs.py)"
        - "learned (ONNX policy — v2 track, see docs/concepts/learned-verbs.md)"
    validations:
      required: true
  - type: input
    id: robot
    attributes:
      label: Which robot provides it?
      description: >-
        For an extension, the adapter whose manifest will declare it (any of the seven
        `quackd list-adapters` prints, or a new one). For a core verb, what a manifest must
        have for it to appear (a camera, a twist intent, a sound intent).
      placeholder: e.g. lerobot, or for a core verb, needs a camera and a gaze intent
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: LLM-facing description (one or two sentences the model will read)
    validations:
      required: true
  - type: textarea
    id: params
    attributes:
      label: Parameters and their ranges
      placeholder: |
        radius_m: float, 0.2–1.0
        direction: "left" | "right"
  - type: textarea
    id: done
    attributes:
      label: Done condition and timeout
  - type: dropdown
    id: safety
    attributes:
      label: Safety class
      options: ["safe", "confirm", "dangerous"]
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Which upstream methods does it need?
      description: >-
        The intent it sends and the upstream call behind it, with a link if you have read it in
        upstream source: duck-ipc-proto for a Microduck, LeRobot, or a ROS message type.
        Unverified names ship UNVERIFIED in that adapter's upstream_api.py, never
        guessed. See docs/adapters/writing-an-adapter.md.
