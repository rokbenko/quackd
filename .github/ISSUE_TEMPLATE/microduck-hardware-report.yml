name: Microduck hardware report
description: You ran quackd against a real Microduck. Tell us what happened.
labels: ["microduck", "hardware", "adapter-status"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Nobody has run `microduck:jsonrpc` against a physical Microduck, so yours
        is the first real evidence either way, and a report that says "it did not work" is
        worth as much as one that says it did.

        Please follow [docs/adapters/microduck/hardware-checklist.md](https://github.com/rokbenko/quackd/blob/main/docs/adapters/microduck/hardware-checklist.md)
        first. It is ordered so the duck's feet stay off the ground until step 9, and nothing
        in it installs anything on the robot. The one step that can need `sudo`, putting your
        account in the robot's `robot` group, is marked as the owner's to allow.
  - type: input
    id: quackd_version
    attributes:
      label: quackd version
      description: Output of `quackd --version`
    validations:
      required: true
  - type: input
    id: api_version
    attributes:
      label: The robot's API version
      description: >-
        What the handshake said: the `robotd` row under `quackd doctor`'s health names it, with
        the release and the revision. quackd serves any robotd from API 23 up and warns when it
        is not the 41 it read, and a call whose shape moved fails the verb naming the call and
        both versions.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Robot release
      description: "`robotctl version` on the duck, or the release in `quackd doctor`'s `robotd` row"
    validations:
      required: false
  - type: dropdown
    id: step
    attributes:
      label: Which checklist step did you reach?
      options:
        - "1 — ssh forward"
        - "2 — doctor, handshake and health"
        - "3 — posture is not unknown"
        - "4 — dry run moves nothing"
        - "5 — sound"
        - "6 — video"
        - "7 — head, on a stand"
        - "8 — deadman: tunnel pulled mid-walk"
        - "9 — feet down"
        - "10 — a real task"
    validations:
      required: true
  - type: dropdown
    id: posture
    attributes:
      label: Did `posture` track the real robot?
      description: >-
        quackd reads the policy label `walk` or `stand` as standing and `sit` as sitting, and
        every other label as `unknown`, as it does a duck somebody holds and a limp one, with
        `extras.posture_reason` saying why. The labels were read in robotd's source, and
        nobody has seen them on a robot.
      options:
        - "Yes — sitting read as sitting, standing as standing"
        - "No — it read something else"
        - "It stayed `unknown` (`extras.posture_reason` says why)"
        - "I did not sit the robot down"
    validations:
      required: true
  - type: dropdown
    id: deadman
    attributes:
      label: Did the deadman stop the legs when you pulled the link?
      description: Step 8. This is the protection every later step depends on.
      options:
        - "Yes — velocity went to zero"
        - "No — the legs kept driving"
        - "I did not test it"
    validations:
      required: true
  - type: dropdown
    id: camera
    attributes:
      label: How did you get frames, if you did?
      options:
        - "http://127.0.0.1:8080/frame — mediad's snapshot route"
        - "webrtc:// — mediad's video track"
        - "Another HTTP camera"
        - "No camera"
    validations:
      required: true
  - type: textarea
    id: detections
    attributes:
      label: Did `media.detections` arrive?
      description: >-
        Upstream's source sends them on each WebRTC peer's control datachannel, and only while
        the robot's duck detector is turned on, which it is not by default. Nobody has seen one
        arrive.
    validations:
      required: false
  - type: textarea
    id: skills
    attributes:
      label: What did `robot.subscribe` list in `skills`?
      description: >-
        `Skill` is a free string now, and this list is where a client learns what a robot can
        actually do. quackd reads it to tell a running skill from a gait when it reads posture,
        and its verbs send the names a stock robot answers to.
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: "`quackd doctor` output"
      description: With `--robot microduck:jsonrpc --address ...`, so it includes the live probe.
      render: text
    validations:
      required: true
  - type: textarea
    id: terminal
    attributes:
      label: "`terminal.txt` from the run directory"
      description: >-
        The whole session as you saw it, opening with
        the command that started the run and the version that ran it. Check it before you
        paste: quackd replaces the values of `--api-key` and `--token` and the credentials
        in a `--base-url`, an `--address` or a `--camera-url`, and nothing else on that
        screen (see SECURITY.md).
      render: text
  - type: textarea
    id: transcript
    attributes:
      label: The first lines of `transcript.jsonl`
      description: >-
        From the run directory. This is the artefact that flips the adapter-status row; the
        memory file is an index of what you tried, not evidence.
      render: text
    validations:
      required: true
  - type: textarea
    id: anything_else
    attributes:
      label: Anything that surprised you
      description: Especially anything quackd claimed that turned out not to be true.
    validations:
      required: false
