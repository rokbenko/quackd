name: lerobot-sim assets

# The SO-101's real model, fetched the way a user's first rehearsal fetches it, and the arm
# simulator's real-model sweeps run on top: the seeded grasp, the preflight acceptance sweep,
# the real meshes rendered, and the physics timed against the wall.
#
# Separate from `ci` for the reasons microduck-assets.yml gives. It reaches the network, so
# putting it on the required path would let an upstream outage block a merge. And it downloads
# upstream's model: SO-ARM100's files are Apache-2.0, which would allow a copy, but no upstream
# asset is committed here (CONTRIBUTING.md) and `docs/reference/licenses.md` says neither the
# wheel, the repository nor a CI fixture carries a byte of them. So this job takes them into a
# runner that is then destroyed and caches nothing: an `actions/cache` entry keyed on the pin
# would be restorable by any run, including a fork's, which is a CI fixture by any other name.
#
# It is also the only watchdog on the pin. `ensure_so101` verifies every file against a recorded
# sha256, so a file that stops arriving from the pinned commit, or arrives changed, fails here
# the same night, by name, instead of on somebody's first rehearsal. And it is what
# `lerobot:mujoco`'s status rests on: the sweeps below are the ones docs/adapters/status.md
# names, and CI's own physics job runs only the stand-in.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lerobot-sim-assets
  cancel-in-progress: true

jobs:
  assets:
    name: fetch the arm, then grasp with it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately NOT continue-on-error, for the reason toddlerbot-contract.yml gives: it
    # runs on a schedule and on demand, so it gates nothing by construction, and the flag
    # would only buy a green tick on a run that failed.
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      # Ten seeds of ten, where a developer's machine is asked for eight.
      QUACKD_STRICT_SEEDS: "1"
      # Without this a runner that cannot make a context turns the rendering tests, and every
      # sweep that connects, into skips, and the job goes green having proved nothing.
      QUACKD_REQUIRE_GL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: OSMesa, the software rasteriser mujoco renders through
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (dev + the arm simulator's extra)
        run: uv sync --python 3.12 --extra dev --extra lerobot-sim
      - name: Fetch upstream's model, and check every file against its pin
        # The watchdog. A changed or missing file fails here, with the name of the file that
        # did not match, rather than on a stranger's first rehearsal.
        run: |
          uv run python -c "from quackd_lerobot.sim.assets import ensure_so101; a = ensure_so101(); print(a.model_path, 'pinned:', a.pinned)"
      - name: The grasp and acceptance sweeps on the real model, ten seeds each
        # Each sweep prints its seeds into this log whether it passes or not, and the grasp
        # sweep whether quackd's holding verdict agreed with the world's truth: that is data
        # for the bench, and never asserted.
        run: uv run pytest tests/test_lerobot_sim_model.py tests/test_lerobot_sim.py -m so101_model
