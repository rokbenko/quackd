name: microduck assets

# The Microduck's real model and its real policies, fetched the way a user's first run fetches
# them, and the trained-gait sweep run on top.
#
# Separate from `ci` for two reasons. It reaches the network, so putting it on the required
# path would let an upstream outage block a merge on a project that depends on neither host at
# build time. And it downloads upstream's meshes, which are CC BY-NC-SA:
# `docs/reference/licenses.md` says that neither the wheel, the repository, a CI fixture nor the
# deployed site carries a byte of them, so this job takes them into a runner that is then
# destroyed and caches nothing. An `actions/cache` entry keyed on the pin would be restorable by
# any run, including a fork's, which is a CI fixture in the sense a reader of that sentence
# would mean.
#
# It is also the only watchdog on the two pins. `ensure_microduck` verifies every file against
# a recorded sha256, so if upstream moves the commit's archive or Hugging Face republishes a
# byte, this fails the same night instead of on somebody's first run.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microduck-assets
  cancel-in-progress: true

jobs:
  assets:
    name: fetch the model, then walk on it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately NOT continue-on-error, for the reason toddlerbot-contract.yml gives: it
    # runs on a schedule and on demand, so it gates nothing by construction, and the flag
    # would only buy a green tick on a run that failed.
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      QUACKD_STRICT_SEEDS: "1"
      QUACKD_REQUIRE_GL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: OSMesa, the software rasteriser mujoco renders through
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (dev + the physics extra)
        run: uv sync --python 3.12 --extra dev --extra mujoco
      - name: Fetch upstream's model and policies, and check every file against its pin
        # The watchdog. A moved archive or a republished policy fails here, with the name of
        # the file that did not match, rather than silently on a stranger's first run.
        run: |
          uv run python -c "from quackd_microduck.sim3d.assets import ensure_microduck; a = ensure_microduck(); print(a.robot_dir, a.policies_dir, 'pinned:', a.pinned)"
      - name: find-and-kick on the gait Pollen trained, ten seeds
        run: uv run pytest tests/test_acceptance_mujoco.py tests/test_sim3d.py -m real_duck
