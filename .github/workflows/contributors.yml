name: contributors

# Keeps docs/assets/contributors.svg in step with who has actually contributed.
# Runs after anything lands on main, and weekly so that a contribution which arrives
# some other way (a commit attributed later, a co-author) still shows up.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read only, as in every workflow here: the one job that writes asks for it below.
permissions:
  contents: read

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # It takes about twenty seconds. Without a limit, a hang would run to GitHub's six hours.
    timeout-minutes: 10
    permissions:
      contents: write # to push the refreshed image to main
    steps:
      # The one checkout that keeps its token (persist-credentials is left at its default, true):
      # the last step's `git push` is the token in .git/config. Nothing runs here but the script
      # below and git, and the job holds no other secret.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the push below is made with the token this keeps
          fetch-depth: 0  # lines added is counted from the git history
      - name: Regenerate the contributors image (humans only, one size)
        run: python docs/assets/contributors.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit it only if it changed
        run: |
          if git diff --quiet -- docs/assets/contributors.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/contributors.svg
          git commit -m "docs: refresh the contributors image"
          git push
