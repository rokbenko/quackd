name: fresh install

# What somebody who installs Roboglot today gets, rather than what uv.lock holds. The lock's numpy
# stays old because LeRobot pins it, and a fresh `uv pip install roboglot` has no LeRobot in it, so
# it resolves past it, and no other job here runs that combination. It keeps a schedule of its
# own, off main's run, because what it answers to is other people's releases: one of them breaking
# this should say so here, and should not stop a tag (RELEASING.md wants every job of main's run green).

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# Read only, and every checkout drops its token once the code is fetched: the one job that writes,
# `report`, asks for what it writes below. Nothing here sets UV_LOCKED, since no job installs
# from the lock: the point is what resolves without it.
permissions:
  contents: read

jobs:
  fresh:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # the release tests/rosarm_contract/run.sh pins, as in every workflow here; the uv
          # release decides nothing about which packages are newest
          version: "0.12.21"
      - name: The newest of everything, with no lock
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .fresh
          python_in() { if [ -x .fresh/bin/python ]; then echo .fresh/bin/python; else echo .fresh/Scripts/python.exe; fi; }
          echo "PY=$(python_in)" >> "$GITHUB_ENV"
          editable=(-e .)
          for adapter in adapters/*/; do editable+=(-e "$adapter"); done
          uv pip install --python "$(python_in)" "${editable[@]}" \
            pytest pytest-asyncio pytest-timeout pytest-xdist hatchling pyzmq opencv-python-headless
      - name: Which versions this run is about
        shell: bash
        run: uv pip freeze --python "$PY" | grep -iE '^(numpy|pillow|pydantic|mcp|rich|typer|cryptography|segno)=='
      - name: The whole suite on them
        shell: bash
        run: |
          "$PY" -m pytest -n auto -m "not serial" --junitxml="$RUNNER_TEMP/junit/tests.xml"
      - name: The tests that hold a margin on a wall clock, on their own
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          "$PY" -m pytest -m serial --junitxml="$RUNNER_TEMP/junit/serial.xml"
      - name: Failed tests, in the job's summary
        if: ${{ !cancelled() }}
        shell: bash
        run: uv run --no-project python scripts/ci_failed_tests.py "$RUNNER_TEMP/junit/tests.xml" "$RUNNER_TEMP/junit/serial.xml"

  # pytest above imports the checkout, whatever is installed, so this is what an installed wheel does.
  wheels:
    name: built wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.21"
      - name: Build every package
        run: uv build --all-packages --out-dir dist
      - name: A core and one robot, in a clean environment
        shell: bash
        run: |
          uv venv --python 3.12 bare
          python_in() { if [ -x bare/bin/python ]; then echo bare/bin/python; else echo bare/Scripts/python.exe; fi; }
          echo "PY=$PWD/$(python_in)" >> "$GITHUB_ENV"
          uv pip install --python "$(python_in)" dist/roboglot-*.whl dist/roboglot_microduck-*.whl
      - name: What a person runs first
        shell: bash
        run: |
          set -euo pipefail
          run() { "$PY" -P -c "from roboglot.cli import main; main()" "$@"; }
          run --version
          run doctor
          run list-verbs --robot microduck:mock
          run validate tasks/hello-world.glot
          mkdir first-run && cd first-run
          run run hello-world --llm fake --robot microduck:mock --no-memory

  # A red night nobody opens the Actions tab for is a night nobody hears of. On a scheduled run,
  # after the others, one issue says the nightly is red, takes a comment each night it stays red,
  # and is closed the first night every job passes (scripts/nightly_issue.py). A run started by
  # hand files nothing: whoever started it is watching it.
  report:
    name: an issue while the nightly is red
    needs: [fresh, wheels]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # It takes seconds. Without a limit, a hang would run to GitHub's six hours.
    timeout-minutes: 5
    permissions:
      contents: read # the checkout, for the script
      issues: write # to open, comment on and close the one issue it keeps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, comment on or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          # each job's result, by its id: what the issue names, and nothing from any other host
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/nightly_issue.py
