name: ci

on:
  push:
    # A patch cut from the last tag is never merged into main before it is tagged, since main
    # holds work it leaves out. Pushing its release branch is what runs every job below on the
    # commit the tag will name, before the tag is public (RELEASING.md, step 8).
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Without a limit a hung test ran to GitHub's six hour limit, three times on macOS, and
    # the log named nothing. With it the job fails in 45 minutes at most, and the two
    # faulthandler timers in pyproject.toml and tests/conftest.py have already dumped every
    # thread's stack by then. The limit was 20 minutes while the slowest job, Windows on 3.12,
    # took 14, and the Microduck re-read added minutes of wall-clock tests to every job, so 20
    # would have cancelled healthy runs on a slow day. It was 30 until 0.23.0's Robot Passport
    # tests took both Windows jobs to 26 and 29 minutes, and a slow runner was cancelled at 30
    # with its tests at 91% and none failed or hung.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows is here because it is a documented path, not a courtesy: a Microduck's
        # robotd speaks over a unix socket, Windows cannot open one, and quackd's answer is a
        # specific `ssh -L` message covered by a test that only runs on Windows. Without a
        # Windows job that test never ran anywhere, and neither did the path it describes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lock is current
        # `uv sync` re-locks in silence when pyproject has drifted, so a stale lock used to
        # reach a release rather than a CI failure. quackd[alohamini] once shipped unlocked.
        run: uv lock --check
      - name: Sync (default deps + dev extra — every adapter, no SDKs, no keys)
        run: uv sync --python ${{ matrix.python }} --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (no network, no API keys; seeded sweeps must be 10 of 10)
        run: uv run pytest
        env:
          QUACKD_STRICT_SEEDS: "1"
      - name: Validate starter ducks
        # bash explicitly: pwsh is the default shell on the Windows runner and does not expand
        # a glob for an external command, so this would hand quackd the literal `ducks/*.duck`.
        shell: bash
        run: uv run quackd validate ducks/*.duck

  # The claim the split exists to make: the core on its own is the loop and no robot, and it
  # says so rather than failing somewhere confusing. Proven against built wheels rather than
  # the working tree, because that is what somebody actually installs.
  packaging:
    name: a bare install brings no robot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build every package
        run: uv build --all-packages --out-dir dist
      - name: Install the core alone
        run: |
          uv venv --python 3.12 bare
          uv pip install --python bare dist/quackd-*.whl
      - name: The core carries no adapter, and says what to install
        shell: bash
        run: |
          set -euo pipefail
          ./bare/bin/quackd doctor --json > report.json
          python - <<'PY'
          import json
          rows = json.load(open("report.json"))["adapters"]
          assert len(rows) == 9, rows
          assert not any(r["adapter_installed"] for r in rows), rows
          PY
          ! ./bare/bin/quackd run hello-world --llm fake 2>err.txt
          grep -q "no robot adapter is installed" err.txt
      - name: One adapter installed is one adapter usable
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --python bare dist/quackd_lerobot-*.whl
          ./bare/bin/quackd list-verbs --robot lerobot:mock | grep -q move_joints

  physics:
    name: physics · mujoco + osmesa
    runs-on: ubuntu-latest
    # The files that need the physics extra, with it actually installed: the Microduck's two
    # and the arm simulator's, which runs on its primitives-only stand-in. Nothing else in the
    # suite behaves differently when mujoco is present, and `test` already runs it six times.
    #
    # Not a matrix. sim3d has no OS branch; what differs between platforms is the GL stack,
    # and of the three runners only Linux gives a software rasteriser worth testing against.
    # macOS would exercise its own GPU and the Windows image's software GL cannot make an
    # offscreen context at all, so both cells would be skip factories.
    timeout-minutes: 25
    env:
      # Software OpenGL, rendering into process memory. A runner has no GPU, no display and
      # no /dev/dri, and OSMesa is the one mujoco backend that needs none of the three: it
      # dlopens libOSMesa.so.8. `egl` would ask Mesa to enumerate a device that is not there,
      # and glfw under xvfb would add an X server to reach the same llvmpipe. mujoco's OSMesa
      # context is PyOpenGL's, and pyopengl is already one of mujoco's dependencies, so
      # libosmesa6 is the only thing the image is missing.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      QUACKD_STRICT_SEEDS: "1"
      # Without this a runner that cannot make a context turns every rendering test into a
      # skip and the job goes green having proved nothing, which is the state it exists to end.
      QUACKD_REQUIRE_GL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: OSMesa, the software rasteriser mujoco renders through
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (dev + the physics extra — mujoco and onnxruntime, about 42 MB cold)
        run: uv sync --python 3.12 --extra dev --extra mujoco
      - name: Prove the context exists before blaming the physics
        # The cheapest failure first, as toddlerbot-contract.yml proves its imports: a missing
        # system library says so here instead of arriving as a dozen skips further down.
        run: |
          uv run python -c "import mujoco; mujoco.Renderer(mujoco.MjModel.from_xml_string('<mujoco/>'), 64, 64); print('osmesa ok')"
      - name: The physics world, the transport, the renders and the seeded sweep
        # `not real_duck` is the honest half: those need upstream's CC BY-NC-SA model, and
        # this job fetches nothing. The nightly `microduck-assets` job runs them, as a user
        # would, into a runner that is then destroyed. `not so101_model` is the same half for
        # the arm: those need SO-ARM100's model, which this job does not fetch either, and the
        # nightly `lerobot-sim-assets` job runs them the same way.
        run: uv run pytest tests/test_sim3d.py tests/test_acceptance_mujoco.py tests/test_lerobot_sim.py tests/test_lerobot_sim_parity.py tests/test_preflight.py -m "not real_duck and not so101_model"

  # The one place CI loads a LeRobot checkpoint: a tiny random ACT, built by the test from
  # LeRobot's own classes with no pretrained backbone, saved naming LeRobot's default one, which
  # the server has to build without, and both processors saved, put in a Hub cache of its own
  # at a commit and a tag, and served with the Hub and torchvision offline by the real policy
  # server to the real client and an arm behind it (tests/test_policy_pipeline.py). It is what
  # POLICY_PIPELINE's VERIFIED rests on, for ACT on the CPU and nothing more.
  #
  # torch comes from its CPU wheel index first, because this runner has no GPU and the default
  # wheels carry CUDA's gigabytes, and LeRobot after it, at the version policy/upstream_api.py
  # was read at, which keeps the torch already there. `--no-sync` from then on, or `uv run`
  # would sync them both away again. Not a matrix: nothing here differs by platform that the
  # default suite does not already run six times.
  policy:
    name: policy · torch cpu + lerobot, a tiny ACT offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # anything the test's own cache cannot answer is refused rather than fetched
      HF_HUB_OFFLINE: "1"
      QUACKD_STRICT_SEEDS: "1"
      # without it a runner where torch did not install would skip the half that matters and
      # go green having proved nothing, as QUACKD_REQUIRE_GL is for the physics job
      QUACKD_REQUIRE_TORCH: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (default deps + dev extra)
        run: uv sync --python 3.12 --extra dev
      - name: torch from its CPU wheel index, then LeRobot 0.6.1
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.7,<2.12" "torchvision>=0.22,<0.27"
          uv pip install "lerobot==0.6.1"
      - name: Prove the imports before blaming the pipeline
        run: |
          uv run --no-sync python -c "import torch, lerobot; from lerobot.policies.act.modeling_act import ACTPolicy; print('torch', torch.__version__, 'lerobot', lerobot.__version__, 'cuda', torch.cuda.is_available())"
      - name: A tiny ACT through the real server, and the protocol with torch installed
        run: uv run --no-sync pytest tests/test_policy_pipeline.py tests/test_policy_contract.py tests/test_upstream_api.py
