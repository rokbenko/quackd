name: ci

on:
  push:
    # A patch cut from the last tag is never merged into main before it is tagged, since main
    # holds work it leaves out. Pushing its release branch is what runs every job below on the
    # commit the tag will name, before the tag is public (RELEASING.md, step 8).
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Without a limit a hung test ran to GitHub's six hour limit, three times on macOS, and
    # the log named nothing. With it the job fails in 30 minutes at most, and the two
    # faulthandler timers in pyproject.toml and tests/conftest.py have already dumped every
    # thread's stack by then. The limit was 20 minutes while the slowest job, Windows on 3.12,
    # took 14, and the Microduck re-read added minutes of wall-clock tests to every job, so 20
    # would have cancelled healthy runs on a slow day. It was 30 until 0.23.0's Robot Passport
    # tests took both Windows jobs to 26 and 29 minutes, and a slow runner was cancelled at 30
    # with its tests at 91% and none failed or hung. It was 45 until 0.29.0's onboard tests took
    # Windows on 3.12 to 44 and a half minutes of tests, and that job was cancelled at 45 seconds
    # after every one of them had passed. It was 60 until the suite stopped listing its own temp
    # directory for every test and took every core a runner has: Windows on 3.12 went from 51 and
    # a half minutes of tests to about 8, so 30 still has three times the room, and a hang is
    # called half an hour sooner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is here because it is a documented path, not a courtesy: a Microduck's
        # robotd speaks over a unix socket, Windows cannot open one, and Roboglot's answer is a
        # specific `ssh -L` message covered by a test that only runs on Windows. Without a
        # Windows job that test never ran anywhere, and neither did the path it describes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lock is current
        # `uv sync` re-locks in silence when pyproject has drifted, so a stale lock used to
        # reach a release rather than a CI failure. roboglot[alohamini] once shipped unlocked.
        run: uv lock --check
      - name: Sync (default deps + dev extra — every adapter, no SDKs, no keys)
        run: uv sync --python ${{ matrix.python }} --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (no network, no API keys)
        run: uv run pytest -n auto -m "not serial"
      - name: The tests that hold a margin on a wall clock, on their own
        # Whatever the stage above did: a run that failed there still says how these went.
        if: ${{ !cancelled() }}
        run: uv run pytest -m serial
      - name: Validate starter tasks
        # bash explicitly: pwsh is the default shell on the Windows runner and does not expand
        # a glob for an external command, so this would hand Roboglot the literal `tasks/*.glot`.
        shell: bash
        run: uv run roboglot validate tasks/*.glot

  # The claim the split exists to make: the core on its own is the loop and no robot, and it
  # says so rather than failing somewhere confusing. Proven against built wheels rather than
  # the working tree, because that is what somebody actually installs.
  packaging:
    name: a bare install brings no robot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build every package
        run: uv build --all-packages --out-dir dist
      - name: Install the core alone
        run: |
          uv venv --python 3.12 bare
          uv pip install --python bare dist/roboglot-*.whl
      - name: The core carries no adapter, and says what to install
        shell: bash
        run: |
          set -euo pipefail
          ./bare/bin/roboglot doctor --json > report.json
          python - <<'PY'
          import json
          rows = json.load(open("report.json"))["adapters"]
          # ten adapters, none here, and the row of bodies Roboglot only describes (ADR-0077)
          assert len(rows) == 11, rows
          assert not any(r["adapter_installed"] or r["installed"] for r in rows), rows
          (described,) = [r for r in rows if r["kind"] == "described"]
          assert len(described["backends"]) >= 12, described
          PY
          ! ./bare/bin/roboglot run hello-world --llm fake 2>err.txt
          grep -q "no robot adapter is installed" err.txt
      - name: The core carries no OpenCV, and its detector and its QR code work without it
        shell: bash
        run: |
          set -euo pipefail
          ! ./bare/bin/python -c "import cv2" 2>/dev/null
          ./bare/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          from roboglot.perception.color_blob import ColorBlobDetector
          from roboglot.webui.launch import qr_lines
          frame = Image.new("RGB", (256, 256), (90, 110, 90))
          ImageDraw.Draw(frame).ellipse((100, 100, 150, 150), fill=(255, 140, 0))
          found = ColorBlobDetector().detect(frame)
          assert [d.label for d in found] == ["ball"], found
          assert qr_lines("http://192.168.1.23:8501/?token=abc")
          PY
      - name: One adapter installed is one adapter usable
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --python bare dist/roboglot_lerobot-*.whl
          ./bare/bin/roboglot list-verbs --robot lerobot:mock | grep -q move_joints
      - name: A body over another package's family brings that package with it
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 thin
          uv pip install --python thin dist/roboglot-*.whl dist/roboglot_microduck-*.whl dist/roboglot_huebot-*.whl
          ./thin/bin/roboglot list-verbs --robot huebot:mock > verbs.txt
          grep -q stand_up verbs.txt
          ! grep -q gaze verbs.txt
          ./thin/bin/roboglot doctor --robot huebot:mock --json > report.json
      - name: A family over another package's binding brings that package with it
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 cell
          uv pip install --python cell dist/roboglot-*.whl dist/roboglot_rosbridge-*.whl dist/roboglot_rosarm-*.whl
          ./cell/bin/roboglot list-verbs --robot rosarm:mock > verbs.txt
          grep -q move_joints verbs.txt
          ! grep -q introspect verbs.txt
          ./cell/bin/roboglot doctor --robot rosarm:mock --json > report.json

  ui:
    name: ui · the page roboglot ui serves
    runs-on: ubuntu-latest
    # The files that need Streamlit, with it installed: the page's screens, its token, and a
    # goal, a chat and a Stop run through it end to end. The page's plain modules and the JSON
    # front end it drives run in `test`, on all six cells, without Streamlit, which is how a core
    # install stays free of it.
    #
    # Not a matrix: the page reaches its runs through pipes, which `test` covers on every OS, and
    # what this job adds is Streamlit itself, which is the same on each.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (dev + the ui extra, Streamlit and what it brings)
        run: uv sync --python 3.12 --extra dev --extra ui
      - name: Types, with Streamlit's own present
        run: uv run mypy roboglot/webui
      - name: The page, and a goal, a chat and a Stop run through it
        run: uv run pytest tests/test_webui_app.py tests/test_webui_options.py tests/test_webui_jobs.py tests/test_webui_catalog.py
      - name: roboglot ui starts and answers
        run: |
          uv run roboglot ui --port 8599 --no-browser > ui.log 2>&1 &
          page=$!
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8599/_stcore/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8599/_stcore/health
          # said once the page answers, from a thread of its own, so it may trail the health check.
          # Looked for and never printed: the line carries the page's token, and this log is public
          for _ in $(seq 1 20); do grep -q "roboglot ui: http://127.0.0.1:8599" ui.log && break; sleep 1; done
          grep -q "roboglot ui: http://127.0.0.1:8599" ui.log || { sed -E 's/token=[^ &]+/token=(hidden)/g' ui.log; exit 1; }
          kill "$page"

  onboard:
    name: onboard · py${{ matrix.python }} · bleak and dbus-fast
    runs-on: ubuntu-latest
    # `roboglot onboard` runs on a robot's own computer, and its Bluetooth half is BlueZ over D-Bus,
    # so bleak and dbus-fast install on Linux only and only with the onboard extra. Everything of
    # the radio that is plain Python (the advert, the link frames, proximity, rotation, the sim
    # air) runs in `test`, on all six cells, without them. What this job adds is the two packages
    # themselves: mypy against their own types, the D-Bus objects held to BlueZ's documented
    # interfaces, and the BlueZ radio registering its advert and GATT service with a fake BlueZ
    # and carrying a central's link frames, on a private bus that dbus-run-session starts and
    # stops. bleak's scanner and client never run here: they talk to a real bluetoothd.
    #
    # A matrix of two, as `test` is on Linux, because dbus-fast has a wheel per Python and a
    # Jetson's JetPack 6 runs 3.10 or a uv-managed 3.12, and 3.11 is the floor Roboglot keeps.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # without it a runner where dbus-fast or the bus went missing would skip the D-Bus tests
      # and go green having proved nothing
      ROBOGLOT_REQUIRE_DBUS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: A D-Bus daemon, for the private bus the tests run on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (dev + the onboard extra, which on Linux brings bleak and dbus-fast)
        run: uv sync --python ${{ matrix.python }} --extra dev --extra onboard
      - name: Prove the imports before blaming the radio
        run: uv run python -c "import bleak, dbus_fast, zeroconf; print('bleak and dbus-fast import')"
      - name: Types, with bleak's and dbus-fast's own present
        run: uv run mypy
      - name: The radio with the extra installed, the BlueZ half against a fake BlueZ, and the LAN browse on loopback
        run: dbus-run-session -- uv run pytest tests/test_radio.py tests/test_extras_absent.py tests/test_radio_bluez_core.py tests/test_radio_bluez_privacy.py tests/test_radio_bluez_objects.py tests/test_radio_bluez_bus.py tests/test_lan_passport_browser.py

  # The one place CI loads LeRobot checkpoints: a tiny random ACT, built by the test from
  # LeRobot's own classes with no pretrained backbone, saved naming LeRobot's default one, which
  # the server has to build without, and both processors saved, put in a Hub cache of its own
  # at a commit and a tag, and served with the Hub and torchvision offline by the real policy
  # server to the real client and an arm behind it, and a tiny random X-VLA beside it, its
  # Florence-2 described in its config and a tokenizer of a few words pinned at a commit in a
  # cache of its own (tests/test_policy_pipeline.py). They are what POLICY_PIPELINE's VERIFIED
  # rests on, for those two types on the CPU and nothing more.
  #
  # It is also the one job with LeRobot installed, so the arm's real backend runs here over
  # LeRobot's own follower and bus, with rustypot's Bus, the part that talks to the port,
  # replaced by a fake (tests/test_lerobot_real_bus.py), which needs the `[feetech]` extra for
  # rustypot's servo definitions. That is what the joint naming and the handshake's port rest
  # on, and it opens no serial port.
  #
  # torch comes from its CPU wheel index first, because this runner has no GPU and the default
  # wheels carry CUDA's gigabytes, inside the window LeRobot 0.7.0 asks for, and LeRobot after
  # it, at the version policy/upstream_api.py was read at, with its X-VLA extra for transformers,
  # which keeps the torch already there. Nothing here holds huggingface-hub below 2, as diffusers
  # does in uv.lock, so this job runs the newest hub LeRobot allows. `--no-sync` from then on, or
  # `uv run` would sync them both away again. Not a matrix: nothing here differs by platform that
  # the default suite does not already run six times. Pillow is the lock's here as in every job,
  # 13 being Roboglot's floor and inside LeRobot 0.7.0's cap, so no job runs an older one.
  policy:
    name: policy · torch cpu + lerobot, a tiny ACT and a tiny X-VLA offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # anything the test's own cache cannot answer is refused rather than fetched
      HF_HUB_OFFLINE: "1"
      # without it a runner where torch did not install would skip the half that matters and
      # go green having proved nothing
      ROBOGLOT_REQUIRE_TORCH: "1"
      # the same for the arm's bus: no rustypot is a failure here, not a skip
      ROBOGLOT_REQUIRE_LEROBOT_BUS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (default deps + dev extra)
        run: uv sync --python 3.12 --extra dev
      - name: torch from its CPU wheel index, then LeRobot 0.7.0
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.7,<2.16" "torchvision>=0.22,<0.30"
          uv pip install "lerobot[xvla,feetech]==0.7.0"
      - name: Prove the imports before blaming the pipeline
        run: |
          uv run --no-sync python -c "import torch, lerobot, transformers, rustypot; from lerobot.policies.act.modeling_act import ACTPolicy; from lerobot.policies.xvla.modeling_xvla import XVLAPolicy; print('torch', torch.__version__, 'lerobot', lerobot.__version__, 'transformers', transformers.__version__, 'cuda', torch.cuda.is_available())"
      - name: A tiny ACT and a tiny X-VLA through the real server, the protocol with torch installed, and the arm over LeRobot's own bus
        run: uv run --no-sync pytest tests/test_policy_pipeline.py tests/test_policy_contract.py tests/test_upstream_api.py tests/test_lerobot_real_bus.py
