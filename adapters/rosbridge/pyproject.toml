[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboglot-rosbridge"
dynamic = ["version"]
description = "Any wheeled base that speaks rosbridge, as a Roboglot robot. Install it as roboglot[rosbridge]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["roboglot>=0.34.0,<0.35"]

[project.optional-dependencies]
sdk = ["roslibpy>=2,<3"]

[project.entry-points."roboglot.adapters"]
rosbridge = "roboglot_rosbridge"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/rosbridge/README.md"

[tool.hatch.version]
path = "src/roboglot_rosbridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roboglot_rosbridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
roboglot = { workspace = true }
