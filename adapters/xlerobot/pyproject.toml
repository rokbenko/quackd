[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd-xlerobot"
dynamic = ["version"]
description = "The XLeRobot dual-arm cart adapter for quackd. Install it as quackd[xlerobot]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["quackd>=0.17.0,<0.18", "pyzmq>=26"]


[project.entry-points."quackd.adapters"]
xlerobot = "quackd_xlerobot"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/xlerobot/README.md"

[tool.hatch.version]
path = "src/quackd_xlerobot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quackd_xlerobot"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
quackd = { workspace = true }
