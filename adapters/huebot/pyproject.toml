[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd-huebot"
dynamic = ["version"]
description = "The Huebot adapter for quackd. Install it as quackd[huebot]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["quackd>=0.29.0,<0.30"]

[project.entry-points."quackd.adapters"]
huebot = "quackd_huebot"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/huebot/README.md"

[tool.hatch.version]
path = "src/quackd_huebot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quackd_huebot"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
quackd = { workspace = true }
