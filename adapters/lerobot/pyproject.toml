[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboglot-lerobot"
dynamic = ["version"]
description = "The LeRobot SO-101 arm adapter for Roboglot. Install it as roboglot[lerobot]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["roboglot>=0.34.0,<0.35"]

# The arm's own SDK. LeRobot needs Python 3.12 and pulls torch, and the marker keeps the lock
# solvable on 3.11, where this package still installs and still gives you `lerobot:mock`.
# `[feetech]` is where the serial library lives: without it `import lerobot` succeeds and opening
# the arm's port fails, which is a worse thing to find out at a bench than at an install. Since
# 0.7.0 that library is rustypot, which replaced feetech-servo-sdk under one bus for every Feetech
# and Dynamixel servo (LeRobot's #4672), and 0.7.0 is the release upstream_api.py was read at. The
# floor is that release, because 0.6's bus is not the one Roboglot reads the arm through, and the
# ceiling is its next patch: the arm's stop, release and close lean on the bus as it reads at
# 0.7.0, and a patch may move it, so rustypot, the part that talks to the port, is held below its
# next minor too. Raise them with upstream_api.py and with the ignores in .github/dependabot.yml;
# PLAN.md says what an arm still owes the release before.
[project.optional-dependencies]
sdk = [
  "lerobot[feetech]>=0.7,<0.7.1; python_version >= '3.12'",
  "rustypot>=1.13.1,<1.14; python_version >= '3.12'",
]
# The policy server's, `roboglot policy serve --policy REPO@REVISION`, in a process of its own and
# never the arm's: LeRobot with torch, and the extras of every type the server serves that has
# one, `[smolvla]`, `[pi]` for pi05 and pi0 and `[xvla]`, which bring the transformers their
# tokenizers load with. A GR00T answers with diffusers and dm-tree besides, so those two come
# here rather than LeRobot's `[groot]`, whose datasets, pyarrow, pandas, av, torchcodec, decord,
# peft and timm, about 340 MB, are for training (upstream_api.GROOT_INFERENCE_PACKAGES).
# `[diffusers-dep]` is LeRobot's own pin of diffusers, and dm-tree's is the one its `[groot]`
# takes. No `[feetech]`, since the server never opens a serial port. A pi05, a pi0 or a GR00T
# also wants a Hub token for its gated tokenizer (docs/adapters/lerobot/README.md).
vla = [
  "lerobot[smolvla,pi,xvla,diffusers-dep]>=0.7,<0.7.1; python_version >= '3.12'",
  "dm-tree>=0.1.8,<1.0.0; python_version >= '3.12'",
]

[project.entry-points."roboglot.adapters"]
lerobot = "roboglot_lerobot"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/lerobot/README.md"

[tool.hatch.version]
path = "src/roboglot_lerobot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roboglot_lerobot"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
roboglot = { workspace = true }
