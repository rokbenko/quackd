[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd-lerobot"
dynamic = ["version"]
description = "The LeRobot SO-101 arm adapter for quackd. Install it as quackd[lerobot]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["quackd>=0.29.0,<0.30"]

# The arm's own SDK. LeRobot needs Python 3.12 and pulls torch, and the marker keeps the lock
# solvable on 3.11, where this package still installs and still gives you `lerobot:mock`.
# `[feetech]` is where the serial SDK lives: without it `import lerobot` succeeds and opening
# the arm's port fails, which is a worse thing to find out at a bench than at an install.
[project.optional-dependencies]
sdk = ["lerobot[feetech]>=0.6; python_version >= '3.12'"]
# The arm's simulator, `lerobot:mujoco`: MuJoCo on the CPU and nothing of LeRobot's, so it
# installs on 3.11 as well. The SO-101's model is fetched at run time and never shipped.
sim = ["mujoco>=3.12,<4"]
# The policy server's, `quackd policy serve --policy REPO@REVISION`, in a process of its own and
# never the arm's: LeRobot with torch, and the extras of every type the server serves that has
# one, `[smolvla]`, `[pi]` for pi05 and pi0 and `[xvla]`, which bring the transformers their
# tokenizers load with. A GR00T answers with diffusers and dm-tree besides, so those two come
# here rather than LeRobot's `[groot]`, whose datasets, pyarrow, pandas, av, torchcodec, decord,
# peft and timm, about 340 MB, are for training (upstream_api.GROOT_INFERENCE_PACKAGES).
# `[diffusers-dep]` is LeRobot's own pin of diffusers, and dm-tree's is the one its `[groot]`
# takes. No `[feetech]`, since the server never opens a serial port. A pi05, a pi0 or a GR00T
# also wants a Hub token for its gated tokenizer (docs/adapters/lerobot/README.md).
vla = [
  "lerobot[smolvla,pi,xvla,diffusers-dep]>=0.6,<0.7; python_version >= '3.12'",
  "dm-tree>=0.1.8,<1.0.0; python_version >= '3.12'",
]

[project.entry-points."quackd.adapters"]
lerobot = "quackd_lerobot"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/lerobot/README.md"

[tool.hatch.version]
path = "src/quackd_lerobot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quackd_lerobot"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
quackd = { workspace = true }
