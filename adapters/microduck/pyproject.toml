[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboglot-microduck"
dynamic = ["version"]
description = "The Microduck adapter for Roboglot. Install it as roboglot[microduck]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["roboglot>=0.34.0,<0.35"]

[project.optional-dependencies]
# The duck's WebRTC camera: mediad's H.264 video track, which takes being a WebRTC peer.
# mediad's GET /frame, one PNG per request, needs none of this. Heavy, and needed by nobody
# who is not pulling the track off a real Microduck.
camera = ["aiortc>=1.9", "av>=12", "websockets>=13"]

[project.entry-points."roboglot.adapters"]
microduck = "roboglot_microduck"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/microduck/README.md"

[tool.hatch.version]
path = "src/roboglot_microduck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roboglot_microduck"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
roboglot = { workspace = true }
