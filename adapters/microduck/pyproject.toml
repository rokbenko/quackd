[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd-microduck"
dynamic = ["version"]
description = "The Microduck adapter for quackd, with its simulators. Install it as quackd[microduck]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["quackd>=0.28.0,<0.29"]

[project.optional-dependencies]
# The physics simulator: MuJoCo on the CPU, no GPU, both imported only inside connect().
# onnxruntime is what runs alpha_walking and alpha_stand, the walk Pollen trained before the
# velstand a stock robot runs; the meshes and those policies are fetched at run time and never
# shipped here (docs/reference/licenses.md).
mujoco = ["mujoco>=3.12,<4", "onnxruntime>=1.20"]
# The duck's WebRTC camera: mediad's H.264 video track, which takes being a WebRTC peer.
# mediad's GET /frame, one PNG per request, needs none of this. Heavy, and needed by nobody
# who is not pulling the track off a real Microduck.
camera = ["aiortc>=1.9", "av>=12", "websockets>=13"]

[project.entry-points."quackd.adapters"]
microduck = "quackd_microduck"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/microduck/README.md"

[tool.hatch.version]
path = "src/quackd_microduck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quackd_microduck"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
quackd = { workspace = true }
