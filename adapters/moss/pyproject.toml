[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboglot-moss"
dynamic = ["version"]
description = "The MOSS litter-picking rover adapter for Roboglot. Install it as roboglot[moss]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["roboglot>=0.34.0,<0.35"]


[project.entry-points."roboglot.adapters"]
moss = "roboglot_moss"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/moss/README.md"

[tool.hatch.version]
path = "src/roboglot_moss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roboglot_moss"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
roboglot = { workspace = true }
