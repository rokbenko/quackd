[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd-moss"
dynamic = ["version"]
description = "The MOSS litter-picking rover adapter for quackd. Install it as quackd[moss]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["quackd>=0.25.0,<0.26"]


[project.entry-points."quackd.adapters"]
moss = "quackd_moss"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/moss/README.md"

[tool.hatch.version]
path = "src/quackd_moss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quackd_moss"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
quackd = { workspace = true }
