[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "roboglot-open-duck"
dynamic = ["version"]
description = "The Open Duck Mini v2 adapter for Roboglot. Install it as roboglot[open_duck]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["roboglot>=0.34.0,<0.35"]


[project.entry-points."roboglot.adapters"]
open_duck = "roboglot_open_duck"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/open_duck/README.md"

[tool.hatch.version]
path = "src/roboglot_open_duck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/roboglot_open_duck"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
roboglot = { workspace = true }
