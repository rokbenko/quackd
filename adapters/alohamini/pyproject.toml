[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quackd-alohamini"
dynamic = ["version"]
description = "The AlohaMini adapter for quackd. Install it as quackd[alohamini]."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Rok Benko" }]
dependencies = ["quackd>=0.16.1,<0.17", "pyzmq>=26"]


[project.entry-points."quackd.adapters"]
alohamini = "quackd_alohamini"

[project.urls]
Homepage = "https://github.com/rokbenko/quackd"
Documentation = "https://github.com/rokbenko/quackd/blob/main/docs/adapters/alohamini/README.md"

[tool.hatch.version]
path = "src/quackd_alohamini/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quackd_alohamini"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
quackd = { workspace = true }
