hook: "Typed `yes` at the question that opens the jaws, and quackd took it as a no: only a bare Enter opens them, so the gripper stayed shut and the arm folded up."
goal_met: "Yes"
why_example: >
  At the end of a by-hand run quackd asks the person to take hold of whatever is in the gripper and
  press Enter, and that Enter opens the jaws on what is in them. Most programs want `yes` typed at a
  question, so a person may type it out of habit, and until 0.30.1 a typed `yes` counted as yes. Since
  then only a bare Enter opens the jaws: a line with anything on it is a no. This example types `yes`
  at that question to check.
why_result: >
  The typed word was a no, said in plain words, and the run folded the arm with the jaws shut: `a
  line was typed rather than a bare Enter, so the gripper stays shut and the arm folds up`. A word
  typed from habit cannot open the jaws on something a person has not taken hold of yet; only the
  bare Enter the question asks for does.
goal: >
  Show that at the question that opens the jaws, a typed word, even `yes`, counts as no, as it has
  since 0.30.1, and that quackd says so.
expected: >
  What you type shows as you type it. After Enter: `a line was typed rather than a bare Enter, so the
  gripper stays shut and the arm folds up`, with the question on the record as `-> no`. Then the 3 s
  count, and the fold with the jaws shut.
showed:
  - >
    This ran on a computer whose CPU was under heavy load from other work, as a real setup can be.
    quackd took 20.34 s to connect, where the same arm connected in 2.6 to 8 s in other runs, and its
    calls to the arm took 9.3 ms at the median, 588.5 ms at the 99th percentile and up to 1.06 s.
  - >
    With no LLM and no key, `--llm fake` flew the task's scripted pilot. The arm was lifted by hand and
    held, Enter at `the arm is yours`, and the pilot's three calls ended in its `declare_success`.
  - >
    At `Take hold of whatever is in the gripper and press Enter`, `yes` was typed and entered, and
    quackd answered `(a line was typed rather than a bare Enter, which is a no)`. The question is on
    the record as `-> no` and the hand-back as `skipped: a line was typed`, and quackd said `a line
    was typed rather than a bare Enter, so the gripper stays shut and the arm folds up`.
  - >
    Then the 3 s count, `folding the arm to its rest pose in 3 s: take your hands away from it now`,
    and the fold, with the jaws left shut.
  - >
    The loaded computer slowed that fold: its sends came about 2.5 a second, against about 10 on a
    computer with time to spare, so it ran out of time at shoulder_lift -32 of -101. Enter at the
    question that followed folded once more, which ran out of time at -81, and Enter at the second
    question took torque off where the arm stood, with both hands at the laptop and the arm nearly
    folded, so it settled the rest of the way. The run ended SUCCESS, the scripted pilot's own
    verdict.
  - >
    The video's caption marks only the typed `yes`, the point of the example.
did_not_show:
  - >
    The record does not hold the typed word itself: quackd's trace keeps its own lines, and what a
    person types shows only on their screen. The video's caption names it.
  - >
    It does not show a bare Enter opening the jaws, the other half of the question, or anything held
    in them: nothing was.
  - >
    The slow step the card's block asks for was not on: the record gives 5 degrees per send.
  - >
    No LLM read anything. The three LLM calls in the table are the scripted pilot's turns, and its
    tokens are that pilot's own estimate. Nothing was billed. The table gives no first motion because
    no verb moved the arm: the person lifted it, and the folds were the run's own close.
  - >
    The GIF plays at 5x.
