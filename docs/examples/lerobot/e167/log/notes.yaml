hook: Asked to drive a real arm it could never fold away afterwards, quackd refused before it touched anything.
goal_met: "Yes"
why_example: >
  At the end of a run quackd folds a real arm to its recorded rest pose before letting go. An arm with
  no rest pose has nothing to be folded to, and quackd keeps its torque on rather than let it fall
  where it stands, which leaves it holding itself up wherever it stopped. An arm named by its spec,
  `lerobot:real`, instead of by a registered name has nowhere to keep that pose. This example types it
  that way on purpose, to show what quackd does about it.
why_result: >
  The trouble would come at the end of a run, and quackd refused at the very start, before it connected
  to anything or asked an LLM. The mistake cost no tokens and wrote no run folder, and the arm did not
  move. The refusal also said how to put it right, in two commands, with the port the person had typed.
  A safety rule is at its best when the wrong line costs nothing and the next step is written out.
goal: >
  Show the refusal that keeps a real arm from being left holding itself up: named by its spec it has
  no name to keep a rest pose under, so quackd refuses it before anything connects, a dry run included.
expected: >
  `✗ error: lerobot:real names no registered arm, so it has no rest pose`, with the rest of the reason,
  then the way back, which is `quackd robot add` and then `quackd robot rest-pose`. No run folder, no
  LLM call, and the arm does not move.
showed:
  - >
    quackd printed the refusal and stopped: `lerobot:real names no registered arm, so it has no rest
    pose, and at the end of a run, a dry one included, there is nothing to fold it to, and it would be
    left holding itself up wherever it stopped`.
  - >
    The same message gave the way back, using the port from the command: `quackd robot add NAME
    lerobot:real --address COM3, then quackd robot rest-pose NAME`.
  - >
    The command named an LLM and a port, and neither was used. No LLM was asked, no run folder was
    written, and the arm did not move.
did_not_show:
  - >
    It does not show a dry run being refused. The message says `a dry one included`, but this command
    had no `--dry-run`. The line under Try it yourself has one.
  - >
    It does not show what the refusal prevents. No arm was left holding itself up here, because the
    run never started.
  - >
    The start time in the table is when the terminal's output was saved, because a refused command
    records no time of its own.
  - >
    The GIF is a stock clip of the arm sitting still, used for every run where it did not move.
