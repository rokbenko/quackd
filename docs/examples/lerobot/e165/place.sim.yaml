# What quackd preflight lays out for place.duck on the arm's simulator, and what a run of it has
# to leave behind. The format is in docs/adapters/lerobot/README.md, under The sidecar.
#
# The task starts with a cube between the open jaws, so the cube is laid on the table there,
# between the fingers as the arm starts. It names no size and no weight, so the cube is the size
# of the simulator's own, and weighs what MuJoCo makes of a solid that size.
#
# That start needs an arm that begins with its open jaws pointing down at the table around the
# cube, and neither robot there is to rehearse on begins that way. A twin of arm-01, whose fold
# was recorded on 23 September, is refused at every connect: the fold puts the jaws at the
# table, and was recorded with the gripper shut. The same fold with the gripper open is refused
# too, since closing the gripper from there never brings the moving finger onto the cube. The
# generic arm starts with its hand far above the table, and is refused as well. Laying the cube
# on the table instead would rehearse another task, one with no cube between the jaws, so this
# file is not rewritten for any of them.
#
# The task asks for the cube lifted a little and gives no number, so the check asks for a lift
# and nothing more: the least the simulator counts as one, its centre up 1 cm from where it was
# laid, off the table and touching the gripper (LIFT_MIN_M in the simulator's world.py), at its
# highest. Placing it down is not a check a sidecar can make: lifted and moved each ask for at
# least so far, and neither can ask for the cube back on the table. The close is judged as on
# any run.
scene:
  objects:
    - {name: cube, kind: box, size: [0.0125, 0.0125, 0.0125], place: jaws}
checks:
  - lifted: {object: cube, min_m: 0.01, when: peak}
