# What quackd preflight lays out for first-grasp.duck on the arm's simulator, and what a run of
# it has to leave behind. The format is in docs/adapters/lerobot/README.md, under The sidecar.
#
# The task starts with the jaws open around a foam cube on the table, so the cube is laid there,
# between the fingers as the arm starts. It names no size, so the cube is the size of the
# simulator's own, and no weight, so it weighs what MuJoCo makes of a solid that size, which is
# more than foam would.
#
# That start needs an arm that begins with its open jaws pointing down at the table around the
# cube, and neither robot there is to rehearse on begins that way. A twin of arm-01, whose fold
# was recorded on 23 September, is refused at every connect: the fold puts the jaws at the
# table, and was recorded with the gripper shut. The same fold with the gripper open is refused
# too, since closing the gripper from there never brings the moving finger onto the cube. The
# generic arm starts with its hand far above the table, and is refused as well. Laying the cube
# on the table instead would rehearse another task, one with no cube between the jaws, so this
# file is not rewritten for any of them.
#
# The one check is the task's one number: the cube up two centimetres from where it was laid,
# off the table and touching the gripper, at its highest. Setting it back down is not a check a
# sidecar can make: lifted and moved each ask for at least so far, and neither can ask for the
# cube back on the table. The close is judged as on any run.
scene:
  objects:
    - {name: cube, kind: box, size: [0.0125, 0.0125, 0.0125], place: jaws}
checks:
  - lifted: {object: cube, min_m: 0.02, when: peak}
