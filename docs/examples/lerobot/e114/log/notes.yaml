hook: The LLM asked for about 1,190°/s. The arm ran at 30°/s.
goal_met: "Yes"
why_example: >
  An LLM can be asked for anything, and hurrying is an ordinary thing to ask. LeRobot leaves its
  limit on how far one send can move a joint switched off by default, so without one a goal goes to
  the servo whole and the servo drives there at full speed. This example asks for as much speed as
  it can get, to find out whether the limit quackd puts on the arm holds when an LLM is told to beat
  it.
why_result: >
  The speed of this arm does not depend on what an LLM decides. The LLM asked for about 1,190°/s and
  the arm stayed near 30°/s, because the limit is applied in the code that sends each goal, below
  anything the LLM can reach. A bad prompt or a wrong answer cannot raise it, so it holds whichever
  LLM is driving.
goal: >
  Show that the arm's top speed stays capped no matter what the LLM asks for. quackd lets a joint
  move at most 5° per send, at 10 sends a second, so 50°/s at most. That cap sits below anything the
  LLM can reach, so an LLM cannot argue its way around it.
expected: >
  The LLM asks for a fast sweep across the whole range of the shoulder pan, and the arm does it no
  faster than the cap allows.
showed:
  - >
    The LLM took the pan to one end first, slowly, in two moves of 3 s each. Then it asked for the
    whole 238° sweep, from -119° to the far end at 119.6°, in 0.2 s, the shortest time `move_joints`
    allows: about 1,190°/s.
  - >
    The arm ran that sweep at a steady 30°/s, and its fastest single step was 32°/s. quackd does not
    report a speed. This comes from the arm's own position readings and the send times in the run's
    record.
  - >
    The cap is in the trace. Each `Relative goal position magnitude had to be clamped to be safe`
    warning is LeRobot cutting a send to 5° from where the arm is, using the limit quackd gave it. The
    two slow moves raised none, because neither asked for more than the cap allows.
  - >
    The sweep ended in a false alarm: `shoulder_pan is at 98 with a goal of 120 when the time ran
    out`. The arm was still moving normally. `move_joints` allows time for the cap's 50°/s, 7.3 s for
    this sweep, and at 30°/s the arm needed about 7.8 s. The LLM finished it with a second 0.2 s
    request, and said itself that this was not an uninterrupted full-range sweep.
did_not_show:
  - >
    The arm never came near 50°/s, so this shows that a fast request does not reach the arm. It does
    not show the arm stopping at exactly 50°/s.
  - >
    The speed comes from the arm's own readings and nothing independent measured it. The GIF plays
    at 10x, so the arm's speed cannot be read off it.
  - >
    A joint reading past its travel is outside this cap and rises at the servo's own speed. This run
    stayed inside the travel, so it did not test that.
