# Yaskawa MotoMini: a six-axis miniature industrial arm on the YRC1000micro. quackd describes
# it from Yaskawa's flyer and drives no part of it (ADR-0077). A later binding would reach it
# through MotoROS2 on its controller.
vendor: yaskawa
model: motomini
embodiment: arm
mobility: none
blurb: >-
  a Yaskawa MotoMini, a six-axis miniature industrial arm of 7 kg, bolted to a bench and run
  from its own controller, with no gripper of its own
datasheet:
