# Menlo Asimov-1: an open-source 1.2 m biped. quackd describes it from menlo.ai and its SDK
# documentation and drives no part of it (ADR-0077). A later binding would speak menlo-sdk.
vendor: menlo
model: asimov-1
embodiment: humanoid
mobility: legged
blurb: >-
  a Menlo Asimov-1, an open-source humanoid of 1.2 m with two arms, which walks on two legs
  and is sold as a kit
datasheet:
  manipulator: arms
  arms: 2
  tethered: false
  mass_kg:
    value: 35
    confidence: official
    source: "menlo.ai, Asimov-1 specifications: 35 kg, read 2026-11-05"
  height_m:
    value: 1.2
    confidence: official
    source: "menlo.ai, Asimov-1 specifications: 1.2 m, read 2026-11-05"
  dof:
    value: 25
    confidence: official
    source: "menlo.ai, Asimov-1 specifications: 25 powered joints, read 2026-11-05"
  payload_kg:
    value: 5
    confidence: official
    source: "menlo.ai/asimov-1, the FAQ on how robust it is: 5 kg rated per arm in a curl or a front raise and 6 in a lateral raise, the lower figure, read 2026-11-09"
    note: "per arm, held; 15 kg at peak, for about three seconds"
  cannot:
    - "grip anything in a hand: it has none, since Menlo says manipulation is in active development and its common adapter wrist takes third-party hands (menlo.ai/asimov-1, read 2026-11-09)"
  notes:
    - "the E-Stop in Asimov Manager damps every actuator at once and a free-standing robot falls; nothing in its SDK is an emergency stop (docs.menlo.ai/sdk/safety)"
    - "on its udp and hybrid connections the robot zeroes velocity 2 s after the last velocity command and goes on balancing, and the SDK raises LinkLostError after 2 s without state (docs.menlo.ai/sdk/safety): a deadman, which no binding here uses yet"
    - "in every mode the robot goes to DAMP 2 s after a trajectory's last setpoint, and DAMP drops a free-standing robot (docs.menlo.ai/sdk/safety)"
    - "its firmware caps walking at 0.4 m/s and 0.8 rad/s, and its SDK clamps to the same by default (docs.menlo.ai/sdk/safety); quackd clamps nothing here because it drives nothing"
    - "no endurance figure is on the pages read, and the battery is 491 Wh; Menlo says it is not yet waterproof (menlo.ai/asimov-1) and that a walking robot needs 2 m of clear floor ahead of it (docs.menlo.ai/sdk/safety)"
