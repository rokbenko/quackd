model: bumi
embodiment: humanoid
mobility: legged
blurb: >-
  a Noetix Bumi, a small humanoid just under 1 m tall, which walks on two legs
datasheet:
  manipulator: none
  tethered: false
  terrain: indoor
  mass_kg:
    value: 17
    confidence: official
